<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طقم سهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background:#f7f7f7;padding-bottom:20px}
.header{background:#ff6a00;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.header a{color:#fff;text-decoration:none}
.hero{background:#fff;margin:12px;border-radius:22px;padding:16px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.hero img{width:100%;max-width:360px;border-radius:16px}
.price-new{font-size:32px;font-weight:900;color:#ff6a00}
.price-old{font-size:16px;color:#999;text-decoration:line-through}
.kit-card{background:#fff;margin:12px;border-radius:20px;padding:16px}
.item{border:1.5px solid #eee;border-radius:14px;padding:10px;text-align:center;cursor:pointer}
.item.active{border-color:#ff6a00;background:#fff6ed}
.items{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.size{border:1.5px solid #ddd;border-radius:10px;padding:8px 16px;font-weight:800;cursor:pointer;display:inline-block;margin:4px}
.size.active{background:#ff6a00;color:#fff;border-color:#ff6a00}
.btn-buy{width:100%;background:#ff6a00;color:#fff;border:none;border-radius:14px;padding:16px;font-size:17px;font-weight:900;margin-top:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-buy:disabled{background:#ccc}
.form input{width:100%;padding:13px;border:1.5px solid #eee;border-radius:12px;margin-top:10px;outline:none}
.form input:focus{border-color:#ff6a00}
</style>
</head>
<body>
<div class="header">
  <a href="index.html"><i class="fa-solid fa-arrow-right"></i></a>
  <h2>متجر طقم سهلة</h2>
  <i class="fa-solid fa-bag-shopping"></i>
</div>

<div class="hero">
  <img src="kit.png" alt="طقم سهلة - شنطة وتيشيرت">
  <div style="margin-top:10px"><span style="background:#ff6a00;color:#fff;padding:6px 14px;border-radius:20px;font-weight:800;font-size:12px">الأكثر طلباً</span></div>
  <div style="margin-top:10px"><span class="price-new" id="p">450</span> جنيه <span class="price-old">650</span></div>
</div>

<div class="kit-card">
  <h3>اختار اللي عايزه:</h3>
  <div class="items">
    <div class="item active" onclick="selectKit('full',450,this)"><b>طقم كامل</b><br><small>شنطة + تيشيرت</small><br><b style="color:#ff6a00">450 ج</b></div>
    <div class="item" onclick="selectKit('bag',300,this)"><b>الشنطة فقط</b><br><small>حرارية</small><br><b style="color:#ff6a00">300 ج</b></div>
    <div class="item" onclick="selectKit('shirt',180,this)"><b>التيشيرت فقط</b><br><small>بولو</small><br><b style="color:#ff6a00">180 ج</b></div>
  </div>
  <div id="sizeBox" style="margin-top:12px">
    <b>المقاس:</b><br>
    <div class="size active" onclick="selectSize('M',this)">M</div>
    <div class="size" onclick="selectSize('L',this)">L</div>
    <div class="size" onclick="selectSize('XL',this)">XL</div>
    <div class="size" onclick="selectSize('XXL',this)">XXL</div>
  </div>
  <div class="form">
    <input id="rName" placeholder="اسم المندوب">
    <input id="rPhone" placeholder="رقم الموبايل">
    <input id="rCity" placeholder="المدينة">
  </div>
  <button class="btn-buy" id="buyBtn" onclick="goToPayment()"><i class="fa-solid fa-credit-card"></i> اطلب الآن - طريقة الدفع</button>
</div>

<script>
let selectedKit='full',selectedPrice=450,selectedSize='M';

function selectKit(k,p,el){
  selectedKit=k;selectedPrice=p;
  document.querySelectorAll('.item').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('p').innerText=p;
  document.getElementById('sizeBox').style.display=k=='bag'?'none':'block';
}

function selectSize(s,el){
  selectedSize=s;
  document.querySelectorAll('.size').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
}

async function goToPayment(){
 let name=document.getElementById('rName').value.trim();
 let phone=document.getElementById('rPhone').value.trim();
 let city=document.getElementById('rCity').value.trim();
 if(!name||!phone){alert('اكتب الاسم والموبايل');return}

 let btn = document.getElementById('buyBtn');
 btn.disabled = true;
 btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري حفظ الطلب...';

 // 1. جهز الطلب اللي هيظهر في لوحة التحكم store_orders.html
 let orderForAdmin = {
   name: name,
   phone: phone,
   city: city,
   address: city,
   kit: selectedKit,
   size: selectedKit=='bag' ? 'بدون مقاس' : selectedSize,
   color: 'برتقالي سهلة',
   qty: 1,
   price: selectedPrice,
   status: 'pending',
   date: new Date().toLocaleString('ar-EG'),
   timestamp: Date.now()
 };

 try{
   // 2. ابعته ل Firebase عشان يظهر في لوحة التحكم
   let res = await fetch(DB_URL + '/store_orders.json', {
     method: 'POST',
     headers: {'Content-Type':'application/json'},
     body: JSON.stringify(orderForAdmin)
   });
   let result = await res.json();
   let orderKey = result.name; // الـ ID اللي Firebase رجعه

   // 3. احفظه برضه مؤقتا عشان صفحة الدفع تقراه
   let tempOrder={
     orderKey: orderKey,
     riderId: localStorage.getItem('riderId')||phone,
     name:name,
     phone:phone,
     city:city,
     kit:selectedKit,
     size:selectedSize,
     price:selectedPrice,
     date: new Date().toISOString()
   };
   localStorage.setItem('temp_kit_order', JSON.stringify(tempOrder));

   // 4. روح لصفحة الدفع ومعاك مفتاح الطلب
   location.href='kit-payment.html?order='+orderKey;

 }catch(e){
   alert('فشل حفظ الطلب: '+e.message);
   btn.disabled = false;
   btn.innerHTML = '<i class="fa-solid fa-credit-card"></i> اطلب الآن - طريقة الدفع';
 }
}

window.onload=()=>{
  let rid=localStorage.getItem('riderId');
  if(rid) document.getElementById('rPhone').value=rid;
}
</script>
</body>
  </html>

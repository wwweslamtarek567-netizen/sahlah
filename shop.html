<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طقم سهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background:#f7f7f7;padding-bottom:20px}
.header{background:#ff6a00;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.header a{color:#fff;text-decoration:none}
.hero{background:#fff;margin:12px;border-radius:22px;padding:16px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.hero img{width:100%;max-width:360px;border-radius:16px;height:280px;object-fit:contain;transition:.3s}
.price-new{font-size:32px;font-weight:900;color:#ff6a00}
.price-old{font-size:16px;color:#999;text-decoration:line-through}
.kit-card{background:#fff;margin:12px;border-radius:20px;padding:16px}
.item{border:1.5px solid #eee;border-radius:14px;padding:10px;text-align:center;cursor:pointer;transition:.2s;position:relative}
.item.active{border-color:#ff6a00;background:#fff6ed}
.item img{width:100%;height:80px;object-fit:contain;margin-bottom:6px}
.items{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.size{border:1.5px solid #ddd;border-radius:10px;padding:8px 16px;font-weight:800;cursor:pointer;display:inline-block;margin:4px}
.size.active{background:#ff6a00;color:#fff;border-color:#ff6a00}
.btn-buy{width:100%;background:#ff6a00;color:#fff;border:none;border-radius:14px;padding:16px;font-size:17px;font-weight:900;margin-top:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-buy:disabled{background:#aaa!important;cursor:not-allowed}
.form input{width:100%;padding:13px;border:1.5px solid #eee;border-radius:12px;margin-top:10px;outline:none}
.form input:focus{border-color:#ff6a00}

/* وضع القفل */
.store-closed-all{filter:grayscale(1);opacity:0.5;pointer-events:none}
.item.locked{filter:grayscale(1);opacity:0.6;pointer-events:none}
.product-lock{position:absolute;top:6px;left:6px;background:#333;color:white;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:5;font-size:14px}
.lock-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:9999;display:none;justify-content:center;align-items:center;flex-direction:column;color:white;text-align:center;padding:20px}
.lock-overlay.show{display:flex}
.lock-overlay i{font-size:80px;margin-bottom:15px;animation:pop .3s}
@keyframes pop{from{transform:scale(.5)}to{transform:scale(1)}}
</style>
</head>
<body>

<!-- طبقة القفل -->
<div id="closedOverlay" class="lock-overlay">
  <i class="fa-solid fa-lock"></i>
  <h2 style="font-weight:900;font-size:26px">المتجر مغلق حاليا 🔒</h2>
  <p style="font-size:14px;margin-top:8px;opacity:.9">تم إغلاق المتجر مؤقتا من الإدارة<br>تابعنا وسيتم فتحه قريبا</p>
</div>

<div class="header">
  <a href="index.html"><i class="fa-solid fa-arrow-right"></i></a>
  <h2>متجر طقم سهلة</h2>
  <i class="fa-solid fa-bag-shopping"></i>
</div>

<div class="hero" id="heroBox">
  <img id="heroImg" src="full.png" alt="طقم سهلة">
  <div style="margin-top:10px"><span style="background:#ff6a00;color:#fff;padding:6px 14px;border-radius:20px;font-weight:800;font-size:12px" id="heroName">الطقم كامل (شنطة + شتوي)</span></div>
  <div style="margin-top:10px"><span class="price-new" id="p">650</span> جنيه <span class="price-old" id="oldP">750</span></div>
</div>

<div class="kit-card" id="kitCard">
  <h3>اختار اللي عايزه:</h3>
  <div class="items" id="itemsGrid">
    <div class="item active" id="item-full" onclick="selectKit('full',650,'full.png','الطقم كامل (شنطة + شتوي)',750,this)">
      <img src="full.png"><b>طقم كامل</b><br><small>شنطة + شتوي</small><br><b style="color:#ff6a00">650 ج</b>
    </div>
    <div class="item" id="item-bag" onclick="selectKit('bag',400,'bag.png','الشنطة فقط',500,this)">
      <img src="bag.png"><b>الشنطة فقط</b><br><small>حرارية</small><br><b style="color:#ff6a00">400 ج</b>
    </div>
    <div class="item" id="item-winter" onclick="selectKit('winter',300,'winter.png','تيشيرت شتوي',380,this)">
      <img src="winter.png"><b>تيشيرت شتوي</b><br><small>بكم</small><br><b style="color:#ff6a00">300 ج</b>
    </div>
    <div class="item" id="item-summer" onclick="selectKit('summer',220,'summer.png','تيشيرت صيفي',300,this)">
      <img src="summer.png"><b>تيشيرت صيفي</b><br><small>نص كم</small><br><b style="color:#ff6a00">220 ج</b>
    </div>
  </div>
  <div id="sizeBox" style="margin-top:12px">
    <b>المقاس:</b><br>
    <div class="size active" onclick="selectSize('M',this)">M</div>
    <div class="size" onclick="selectSize('L',this)">L</div>
    <div class="size" onclick="selectSize('XL',this)">XL</div>
    <div class="size" onclick="selectSize('XXL',this)">XXL</div>
  </div>
  <div class="form">
    <input id="rName" placeholder="اسم المندوب">
    <input id="rPhone" placeholder="رقم الموبايل">
    <input id="rCity" placeholder="المدينة">
  </div>
  <button class="btn-buy" id="buyBtn" onclick="goToPayment()"><i class="fa-solid fa-credit-card"></i> اطلب الآن - طريقة الدفع</button>
</div>

<script>
let selectedKit='full',selectedPrice=650,selectedSize='M',selectedImg='full.png',selectedProductName='الطقم كامل (شنطة + شتوي)';
let storeIsOpen = true;

function selectKit(k,p,img,name,oldP,el){
  if(!storeIsOpen) return;
  selectedKit=k;selectedPrice=p;selectedImg=img;selectedProductName=name;
  document.querySelectorAll('.item').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('p').innerText=p;
  document.getElementById('oldP').innerText=oldP;
  document.getElementById('heroImg').src=img;
  document.getElementById('heroName').innerText=name;
  document.getElementById('sizeBox').style.display=k=='bag'?'none':'block';
}
function selectSize(s,el){
  if(!storeIsOpen) return;
  selectedSize=s;
  document.querySelectorAll('.size').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
}

async function checkStoreStatus(){
  try{
    let res = await fetch(DB_URL + '/settings/uniformStore.json?t=' + Date.now());
    let data = await res.json();
    let isOpen = data?.isOpen ?? true;
    storeIsOpen = isOpen;
    if(!isOpen){
      document.getElementById('closedOverlay').classList.add('show');
      document.getElementById('heroBox').classList.add('store-closed-all');
      document.getElementById('kitCard').classList.add('store-closed-all');
      // قفل على كل منتج
      document.querySelectorAll('.item').forEach(el=>{
        el.classList.add('locked');
        if(!el.querySelector('.product-lock')){
          let lock = document.createElement('div');
          lock.className='product-lock';
          lock.innerHTML='<i class="fa-solid fa-lock"></i>';
          el.appendChild(lock);
        }
      });
      let btn = document.getElementById('buyBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-lock"></i> المتجر مغلق حاليا';
    } else {
      document.getElementById('closedOverlay').classList.remove('show');
      document.getElementById('heroBox').classList.remove('store-closed-all');
      document.getElementById('kitCard').classList.remove('store-closed-all');
      document.querySelectorAll('.item').forEach(el=>{
        el.classList.remove('locked');
        let l = el.querySelector('.product-lock');
        if(l) l.remove();
      });
      let btn = document.getElementById('buyBtn');
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-credit-card"></i> اطلب الآن - طريقة الدفع';
    }
  }catch(e){ console.log('store check error', e); }
}

async function goToPayment(){
 if(!storeIsOpen){ alert('المتجر مغلق حاليا 🔒'); return; }
 let name=document.getElementById('rName').value.trim();
 let phone=document.getElementById('rPhone').value.trim();
 let city=document.getElementById('rCity').value.trim();
 if(!name||!phone){alert('اكتب الاسم والموبايل');return}

 let btn = document.getElementById('buyBtn');
 btn.disabled = true;
 btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري حفظ الطلب...';

 let orderForAdmin = {
   name: name,
   phone: phone,
   city: city,
   address: city,
   kit: selectedKit,
   productName: selectedProductName,
   image: selectedImg,
   size: selectedKit=='bag' ? 'بدون مقاس' : selectedSize,
   color: 'برتقالي سهلة',
   qty: 1,
   price: selectedPrice,
   status: 'pending',
   date: new Date().toLocaleString('ar-EG'),
   timestamp: Date.now()
 };

 try{
   let res = await fetch(DB_URL + '/store_orders.json', {
     method: 'POST',
     headers: {'Content-Type':'application/json'},
     body: JSON.stringify(orderForAdmin)
   });
   let result = await res.json();
   let orderKey = result.name;

   let tempOrder={
     orderKey: orderKey,
     key: orderKey,
     riderId: localStorage.getItem('riderId')||phone,
     name:name,
     phone:phone,
     city:city,
     kit:selectedKit,
     productName: selectedProductName,
     image: selectedImg,
     size:selectedSize,
     price:selectedPrice,
     date: new Date().toISOString()
   };
   localStorage.setItem('temp_kit_order', JSON.stringify(tempOrder));
   location.href='kit-payment.html?orderId='+orderKey;

 }catch(e){
   alert('فشل حفظ الطلب: '+e.message);
   btn.disabled = false;
   btn.innerHTML = '<i class="fa-solid fa-credit-card"></i> اطلب الآن - طريقة الدفع';
 }
}

window.onload=()=>{
  let rid=localStorage.getItem('riderId');
  if(rid) document.getElementById('rPhone').value=rid;
  checkStoreStatus();
  setInterval(checkStoreStatus, 4000);
}
</script>
</body>
  </html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقعك الحالي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Cairo',sans-serif;}
.header{background:#ff6a00;color:white;padding:15px;text-align:center;font-size:18px;font-weight:700;}
#map{height:400px;width:100%;margin:15px 0;}
.btns{display:flex;gap:10px;padding:0 15px;}
.btn{flex:1;background:#ff6a00;color:white;padding:14px;text-align:center;border-radius:15px;border:none;font-weight:700;font-size:15px;font-family:'Cairo';}
.back-btn{display:block;background:#333;color:white;padding:12px;text-align:center;border-radius:15px;text-decoration:none;font-weight:700;margin:15px;}
</style>
</head>
<body>

<div class="header">📍 موقعك الحالي</div>

<div id="map"></div>

<div class="btns">
  <button class="btn" onclick="getCurrentLocation()">📍 موقعي الحالي</button>
  <button class="btn" onclick="openGoogleMaps()">🧭 تحديد الاتجاهات</button>
</div>

<a href="home.html" class="back-btn">رجوع للرئيسية</a>

<script>
var userLat, userLng;

function getCurrentLocation(){
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(pos){
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      document.getElementById("map").innerHTML = '<iframe width="100%" height="400" src="https://maps.google.com/maps?q='+userLat+','+userLng+'&z=15&output=embed"></iframe>';
    });
  }
}

function openGoogleMaps(){
  if(!userLat){ alert("حدد موقعك الاول"); return; }
  // هنا بيفتح جوجل ماب بالطريق جاهز
  var destination = "31.2660,31.3740"; // الكورنيش جمصة
  window.open('https://www.google.com/maps/dir/'+userLat+','+userLng+'/'+destination);
}

getCurrentLocation();
</script>

</body>
  </html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الخريطة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
body{margin:0;font-family:'Cairo',sans-serif;}
.header{background:#ff6a00;color:white;padding:15px;text-align:center;font-size:18px;font-weight:700;position:fixed;top:0;left:0;right:0;z-index:1000;}
#map{height:100vh;width:100%;padding-top:55px;}
.back-btn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#ff6a00;color:white;padding:12px 30px;border-radius:25px;text-decoration:none;font-weight:700;z-index:1000;}
.location-box{position:fixed;bottom:80px;left:15px;right:15px;background:white;padding:15px;border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,0.2);z-index:1000;}
</style>
</head>
<body>

<div class="header">📍 موقعك الحالي</div>

<div id="map"></div>

<div class="location-box">
  <div style="font-weight:700;">جاري تحديد الموقع...</div>
  <div style="font-size:12px;color:#666;" id="address">برجاء السماح بالوصول للموقع</div>
</div>

<a href="home.html" class="back-btn">رجوع للرئيسية</a>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// خريطة مصر الافتراضية
var map = L.map('map').setView([30.0444, 31.2357], 13);

// اضافة الخريطة
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

// نجيب موقع المستخدم
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(function(position) {
    var lat = position.coords.latitude;
    var lng = position.coords.longitude;
    
    map.setView([lat, lng], 15);
    L.marker([lat, lng]).addTo(map)
      .bindPopup("موقعك الحالي").openPopup();
    
    document.getElementById('address').innerText = "تم تحديد الموقع بنجاح";
  });
}
</script>

</body>
  </html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي - سهلة للتوصيل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Cairo",sans-serif;background:#f7f7f7;color:#161616;min-height:100vh;padding-bottom:88px}
.header{height:215px;position:relative;overflow:hidden;color:#fff;border-radius:0 0 30px 30px;background:radial-gradient(circle at 80% 5%,rgba(255,255,255,.13),transparent 32%),linear-gradient(135deg,#f45100,#ff6410 48%,#ff7b18)}
.header:before,.header:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07);transform:rotate(-18deg)}
.header:before{width:600px;height:170px;right:-180px;top:-70px}.header:after{width:650px;height:170px;left:-220px;bottom:-100px}
.header-inner{height:100%;display:flex;align-items:center;justify-content:space-between;padding:18px 38px;position:relative;z-index:2}
.logo-area{display:flex;align-items:center;gap:14px}.logo-box{width:120px;height:120px;border:1px solid rgba(255,255,255,.32);border-radius:25px;display:flex;align-items:center;justify-content:center}.logo-mark{font-size:50px;font-weight:900;letter-spacing:-7px;transform:skew(-8deg)}
.logo-main{font-size:43px;font-weight:900;line-height:1}.logo-sub{font-size:18px;font-weight:700;text-align:center;margin-top:7px}
.title{font-size:49px;font-weight:900;position:relative;padding-bottom:8px}.title:after{content:"";position:absolute;right:0;bottom:0;width:145px;height:5px;border-radius:10px;background:#fff;transform:rotate(-3deg)}
.container{width:calc(100% - 70px);max-width:1000px;margin:20px auto}
.profile{background:#fff;border-radius:28px;min-height:215px;padding:25px 30px;display:flex;align-items:center;box-shadow:0 4px 18px rgba(0,0,0,.055);margin-bottom:20px}
.avatar{width:165px;height:165px;border-radius:50%;overflow:hidden;flex:none;background:#ffb74d;box-shadow:0 2px 8px rgba(0,0,0,.08)}.avatar img{width:100%;height:100%;object-fit:cover}
.profile-info{flex:1;padding-right:34px}.profile-info h1{font-size:35px;font-weight:900;margin-bottom:6px}
.badge{display:inline-flex;align-items:center;gap:8px;background:#fff0e8;color:#ed5b1b;border-radius:12px;padding:6px 15px;font-size:20px;font-weight:700;margin-bottom:8px}
.person-icon,.phone-icon{color:#ed5b1b;font-weight:900}.phone{display:flex;align-items:center;gap:10px;font-size:21px;direction:ltr;justify-content:flex-start}.profile-arrow{font-size:47px;color:#6d6d6d;line-height:1}
.menu{display:flex;flex-direction:column;gap:17px}.menu-item{border:0;background:#fff;width:100%;min-height:108px;border-radius:25px;display:flex;align-items:center;padding:18px 24px;cursor:pointer;box-shadow:0 3px 15px rgba(0,0,0,.045);font-family:inherit}.menu-item:active{transform:scale(.99)}
.icon-box{width:70px;height:70px;border-radius:22px;background:#fff0e8;color:#f15b1a;display:flex;align-items:center;justify-content:center;flex:none}.icon-box svg{width:40px;height:40px;stroke:currentColor;fill:none;stroke-width:2}
.menu-text{flex:1;text-align:right;padding-right:20px;font-size:27px;font-weight:700}.arrow{font-family:Arial;font-size:43px;color:#707070;line-height:1}
.logout{width:100%;height:84px;margin-top:20px;border:2px solid #f06725;background:#fff8f4;border-radius:24px;color:#e95b18;font-family:inherit;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer}.logout svg{width:35px;height:35px;stroke:currentColor;fill:none;stroke-width:2}
.bottom-nav{position:fixed;z-index:20;right:0;left:0;bottom:0;height:88px;background:#fff;display:flex;align-items:center;justify-content:space-around;box-shadow:0 -3px 14px rgba(0,0,0,.08)}
.nav-item{width:25%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#777;font-size:17px;font-weight:700;cursor:pointer}.nav-item svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:2}.nav-item.active{color:#f15b1a}
@media(max-width:700px){
.header{height:215px}.header-inner{padding:18px}.logo-box{width:74px;height:74px;border-radius:19px}.logo-mark{font-size:31px}.logo-main{font-size:30px}.logo-sub{font-size:13px;margin-top:4px}.title{font-size:35px}.title:after{width:105px;height:4px}
.container{width:calc(100% - 28px);margin:16px auto}.profile{min-height:170px;padding:18px;border-radius:24px}.avatar{width:122px;height:122px}.profile-info{padding-right:15px}.profile-info h1{font-size:24px}.badge{font-size:14px;padding:5px 9px}.phone{font-size:15px}.profile-arrow{font-size:38px}
.menu{gap:14px}.menu-item{min-height:82px;padding:11px 14px;border-radius:21px}.icon-box{width:57px;height:57px;border-radius:18px}.icon-box svg{width:32px;height:32px}.menu-text{font-size:20px;padding-right:12px}.arrow{font-size:34px}.logout{height:67px;font-size:21px;border-radius:20px}.bottom-nav{height:82px}.nav-item{font-size:14px}.nav-item svg{width:29px;height:29px}}
@media(max-width:420px){
.header{height:185px}.logo-box{width:62px;height:62px}.logo-main{font-size:25px}.logo-sub{font-size:11px}.title{font-size:29px}.profile{min-height:145px;padding:13px}.avatar{width:98px;height:98px}.profile-info h1{font-size:20px}.badge{font-size:11px}.phone{font-size:12px}.menu-text{font-size:18px}}
</style>
</head>

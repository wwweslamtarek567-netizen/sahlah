<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>حسابي - سهلة للتوصيل</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial, Tahoma, sans-serif;
      -webkit-tap-highlight-color:transparent;
    }

    body{
      background:#f5f5f5;
      color:#222;
      min-height:100vh;
    }

    .app{
      width:100%;
      max-width:850px;
      min-height:100vh;
      margin:auto;
      background:#f5f5f5;
      overflow:hidden;
      padding-bottom:95px;
    }

    /* الهيدر البرتقاني */
    .header{
      height:290px;
      background:#ff7410;
      border-radius:0 0 48px 48px;
      position:relative;
      padding:54px 38px 0;
    }

    .header-title{
      color:#fff;
      font-size:52px;
      font-weight:900;
      position:absolute;
      left:38px;
      top:105px;
    }

    .logo-box{
      position:absolute;
      right:38px;
      top:55px;
      width:475px;
      height:105px;
      background:rgba(255,255,255,.08);
      border-radius:2px;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      overflow:hidden;
      border-bottom:6px solid #fff;
    }

    .logo-box img{
      width:100%;
      height:100%;
      object-fit:contain;
      object-position:center;
    }

    /* كارت بيانات المندوب */
    .content{
      padding:0 38px;
      margin-top:-2px;
    }

    .profile-card{
      background:#fff;
      border-radius:35px;
      min-height:250px;
      margin-top:0;
      padding:25px 35px;
      box-shadow:0 8px 25px rgba(0,0,0,.06);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .profile-info{
      flex:1;
      text-align:right;
      padding-right:10px;
    }

    .profile-name{
      font-size:42px;
      font-weight:900;
      margin-bottom:20px;
      color:#222;
    }

    .role{
      display:inline-flex;
      align-items:center;
      gap:10px;
      background:#fff0dd;
      color:#ed6f0a;
      border-radius:30px;
      padding:12px 25px;
      font-size:25px;
      font-weight:800;
      margin-bottom:20px;
    }

    .phone{
      direction:ltr;
      text-align:right;
      font-size:26px;
      color:#444;
      font-weight:600;
    }

    .phone-icon{
      color:#ef7410;
      font-size:30px;
      margin-right:8px;
    }

    .rider-photo{
      width:160px;
      height:160px;
      border-radius:50%;
      border:7px solid #f47716;
      padding:3px;
      background:#fff;
      object-fit:cover;
      flex:none;
    }

    /* عناصر الحساب */
    .menu{
      margin-top:28px;
      display:flex;
      flex-direction:column;
      gap:22px;
    }

    .menu-item{
      width:100%;
      height:175px;
      background:#fff;
      border-radius:35px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 30px;
      text-decoration:none;
      color:#222;
      box-shadow:0 6px 20px rgba(0,0,0,.035);
      transition:.15s;
    }

    .menu-item:active{
      transform:scale(.985);
    }

    .menu-right{
      display:flex;
      align-items:center;
      gap:25px;
      font-size:34px;
      font-weight:900;
    }

    .icon{
      width:82px;
      height:82px;
      border-radius:25px;
      background:#fff0dc;
      color:#ed7310;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:44px;
      flex:none;
    }

    .arrow{
      color:#cfcfcf;
      font-size:46px;
      font-weight:300;
    }

    /* شريط التنقل السفلي */
    .bottom-nav{
      position:fixed;
      bottom:0;
      left:50%;
      transform:translateX(-50%);
      width:100%;
      max-width:850px;
      height:105px;
      background:#fff;
      box-shadow:0 -5px 20px rgba(0,0,0,.08);
      display:grid;
      grid-template-columns:repeat(4,1fr);
      z-index:20;
    }

    .nav-item{
      text-decoration:none;
      color:#999;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:8px;
      font-size:20px;
      font-weight:700;
    }

    .nav-item .nav-icon{
      font-size:38px;
      line-height:1;
    }

    .nav-item.active{
      color:#ef7410;
    }

    /* موبايل */
    @media(max-width:600px){
      .header{
        height:290px;
        padding:0 20px;
        border-radius:0 0 40px 40px;
      }

      .header-title{
        left:38px;
        top:108px;
        font-size:43px;
      }

      .logo-box{
        right:28px;
        top:55px;
        width:56%;
        height:100px;
      }

      .content{
        padding:0 38px;
      }

      .profile-card{
        min-height:250px;
        padding:22px 25px;
        border-radius:35px;
      }

      .profile-name{
        font-size:34px;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
        max-width:100%;
      }

      .role{
        font-size:20px;
        padding:10px 18px;
      }

      .phone{
        font-size:21px;
      }

      .rider-photo{
        width:135px;
        height:135px;
      }

      .menu-item{
        height:145px;
        border-radius:32px;
        padding:0 25px;
      }

      .menu-right{
        font-size:29px;
        gap:18px;
      }

      .icon{
        width:72px;
        height:72px;
        border-radius:22px;
        font-size:38px;
      }

      .arrow{
        font-size:40px;
      }

      .bottom-nav{
        height:88px;
      }

      .nav-item{
        font-size:16px;
      }

      .nav-item .nav-icon{
        font-size:31px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="header-title">حسابي</div>

    <div class="logo-box">
      <img src="logo-white.png" alt="سهلة للتوصيل">
    </div>
  </header>

  <main class="content">

    <section class="profile-card">
      <div class="profile-info">
        <div class="profile-name" id="riderName">محمد أحمد</div>

        <div class="role">
          <span>👤</span>
          <span>مندوب توصيل</span>
        </div>

        <div class="phone">
          <span id="riderPhone">01XXXXXXXXX</span>
          <span class="phone-icon">☎</span>
        </div>
      </div>

      <img class="rider-photo" src="rider.png" alt="صورة المندوب">
    </section>

    <section class="menu">

      <a class="menu-item" href="personal.html">
        <div class="menu-right">
          <div class="icon">♙</div>
          <span>البيانات الشخصية</span>
        </div>
        <div class="arrow">‹</div>
      </a>

      <a class="menu-item" href="orders.html">
        <div class="menu-right">
          <div class="icon">▤</div>
          <span>سجل الطلبات</span>
        </div>
        <div class="arrow">‹</div>
      </a>

      <a class="menu-item" href="earnings.html">
        <div class="menu-right">
          <div class="icon">🪙</div>
          <span>الأرباح</span>
        </div>
        <div class="arrow">‹</div>
      </a>

      <a class="menu-item" href="payment.html">
        <div class="menu-right">
          <div class="icon">▣</div>
          <span>طريقة الدفع</span>
        </div>
        <div class="arrow">‹</div>
      </a>

      <a class="menu-item" href="support.html">
        <div class="menu-right">
          <div class="icon">?</div>
          <span>مساعدة ودعم</span>
        </div>
        <div class="arrow">‹</div>
      </a>

      <a class="menu-item" href="settings.html">
        <div class="menu-right">
          <div class="icon">⚙</div>
          <span>الإعدادات</span>
        </div>
        <div class="arrow">‹</div>
      </a>

      <a class="menu-item" href="#" onclick="logout(); return false;">
        <div class="menu-right">
          <div class="icon">↪</div>
          <span>تسجيل الخروج</span>
        </div>
        <div class="arrow">‹</div>
      </a>

    </section>

  </main>
</div>

<nav class="bottom-nav">
  <a class="nav-item active" href="profile.html">
    <div class="nav-icon">♟</div>
    <div>حسابي</div>
  </a>

  <a class="nav-item" href="orders.html">
    <div class="nav-icon">▤</div>
    <div>الطلبات</div>
  </a>

  <a class="nav-item" href="location.html">
    <div class="nav-icon">●</div>
    <div>الموقع</div>
  </a>

  <a class="nav-item" href="index.html">
    <div class="nav-icon">⌂</div>
    <div>الرئيسية</div>
  </a>
</nav>

<script>
  /*
    الصفحة تقرأ اسم ورقم المندوب تلقائياً من localStorage.

    عند تسجيل المندوب في صفحة التسجيل استخدم:
      localStorage.setItem("riderName", name);
      localStorage.setItem("riderPhone", phone);

    مثال:
      localStorage.setItem("riderName", "أحمد محمد");
      localStorage.setItem("riderPhone", "01012345678");
  */

  const savedName = localStorage.getItem("riderName");
  const savedPhone = localStorage.getItem("riderPhone");

  if (savedName && savedName.trim() !== "") {
    document.getElementById("riderName").textContent = savedName;
  }

  if (savedPhone && savedPhone.trim() !== "") {
    document.getElementById("riderPhone").textContent = savedPhone;
  }

  function logout(){
    localStorage.removeItem("riderName");
    localStorage.removeItem("riderPhone");
    window.location.href = "login.html";
  }
</script>

</body>
  </html>

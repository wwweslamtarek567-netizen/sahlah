<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي - سهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:#f5f5f5;padding-bottom:65px;}
.header{background:linear-gradient(135deg, #ff6a00 0%, #ff8533 100%);height:120px;border-radius:0 0 25px 25px;padding:15px 16px;display:flex;justify-content:space-between;align-items:flex-start;}
.header-left{display:flex;align-items:center;gap:10px;}
.header-logo{width:45px;height:45px;}
.header-text{color:white;}
.header-text .title{font-size:24px;font-weight:800;}
.header-text .sub{font-size:11px;font-weight:600;opacity:0.9;}
.header h1{color:white;font-size:22px;font-weight:800;}
.profile-card{background:white;margin:-25px 12px 10px;border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center;}
.avatar{width:75px;height:75px;border-radius:50%;flex-shrink:0;}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;}
.profile-info{flex:1;}
.profile-info h2{font-size:18px;font-weight:800;color:#1a1a1a;margin-bottom:6px;min-height:22px;} /* فاضي لحد ما يتملى */
.badge{background:#fff3e0;color:#ff6a00;padding:5px 10px;border-radius:16px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px;margin-bottom:7px;}
.phone{font-size:13.5px;color:#444;font-weight:600;display:flex;align-items:center;gap:6px;min-height:18px;} /* فاضي */
.phone i{color:#ff6a00;font-size:14px;}
.arrow{color:#bbb;font-size:16px;}
.menu{background:white;margin:8px 12px;border-radius:12px;padding:14px 15px;display:flex;justify-content:space-between;align-items:center;}
.menu-right{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700;color:#222;}
.icon{width:38px;height:38px;background:#fff3e0;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#ff6a00;font-size:19px;}
.menu-arrow{color:#ccc;font-size:14px;}
.btn-logout{margin:12px 12px 20px;width:calc(100% - 24px);padding:14px;background:white;border:1.5px solid #ff6a00;color:#ff6a00;border-radius:12px;font-size:15px;font-weight:800;font-family:'Cairo';display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:5px 0 8px;border-top:1px solid #eee;}
.nav-item{text-align:center;text-decoration:none;color:#999;font-size:10.5px;font-weight:600;}
.nav-item.active{color:#ff6a00;}
.nav-item i{display:block;font-size:22px;margin-bottom:3px;}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <img src="logo-icon.png" class="header-logo" alt="logo">
    <div class="header-text">
      <div class="title">سهلة</div>
      <div class="sub">للتوصيل</div>
    </div>
  </div>
  <h1>حسابي</h1>
</div>

<div class="profile-card">
  <div class="avatar">
    <img src="avatar-default.png" id="riderImg" alt="صورة المندوب">
  </div>
  <div class="profile-info">
    <h2 id="riderName"></h2> <!-- فاضي هيتملى -->
    <div class="badge"><i class="fa-regular fa-user"></i> مندوب توصيل</div>
    <div class="phone"><i class="fa-solid fa-phone"></i> <span id="riderPhone"></span></div> <!-- فاضي -->
  </div>
  <i class="fa-solid fa-chevron-left arrow"></i>
</div>

<div class="menu"><i class="fa-solid fa-chevron-left menu-arrow"></i><div class="menu-right">البيانات الشخصيه<div class="icon"><i class="fa-regular fa-user"></i></div></div></div>
<div class="menu" onclick="location='orders.html'"><i class="fa-solid fa-chevron-left menu-arrow"></i><div class="menu-right">سجل الطلبات<div class="icon"><i class="fa-regular fa-file-lines"></i></div></div></div>
<div class="menu"><i class="fa-solid fa-chevron-left menu-arrow"></i><div class="menu-right">الارباح<div class="icon"><i class="fa-solid fa-coins"></i></div></div></div>
<div class="menu"><i class="fa-solid fa-chevron-left menu-arrow"></i><div class="menu-right">طريقه الدفع<div class="icon"><i class="fa-regular fa-wallet"></i></div></div></div>
<div class="menu"><i class="fa-solid fa-chevron-left menu-arrow"></i><div class="menu-right">مساعده ودعم<div class="icon"><i class="fa-solid fa-headset"></i></div></div></div>
<div class="menu"><i class="fa-solid fa-chevron-left menu-arrow"></i><div class="menu-right">الإعدادات<div class="icon"><i class="fa-solid fa-gear"></i></div></div></div>

<button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</button>

<div class="bottom-nav">
  <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i>الرئيسية</a>
  <a href="map.html" class="nav-item"><i class="fa-solid fa-location-dot"></i>الموقع</a>
  <a href="orders.html" class="nav-item"><i class="fa-regular fa-file-lines"></i>الطلبات</a>
  <a href="profile.html" class="nav-item active"><i class="fa-regular fa-user"></i>حسابي</a>
</div>

<script>
// 1. لو مش مسجل يروح للوجن فورا
var riderId = localStorage.getItem('riderId');
if(!riderId){ 
    window.location.href = 'login.html'; 
}

// 2. يجيب الاسم والرقم والصورة من اللي اتسجلو
window.onload = function(){
    var name = localStorage.getItem('riderName_' + riderId);
    var phone = localStorage.getItem('riderPhone_' + riderId);
    var img = localStorage.getItem('riderImg_' + riderId);
    
    document.getElementById('riderName').innerText = name ? name : '';
    document.getElementById('riderPhone').innerText = phone ? phone : '';
    if(img){ document.getElementById('riderImg').src = img; }
}

function logout(){
  localStorage.removeItem('riderId');
  window.location.href = 'login.html';
}
</script>
</body>
  </html>

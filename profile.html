<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي - سهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Cairo',sans-serif;background:#f5f5f5;padding-bottom:70px;}

/* 1. ظبطت مقاس الصورة اللي فوق - مالية العرض */
.top{background:#ff6a00;height:100px;border-radius:0 0 22px 22px;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 16px;}
.top h1{color:white;font-size:22px;font-weight:800;margin:0;}
.top img{height:30px;}

/* 2. الكارت */
.card{background:white;margin:-25px 14px 10px;border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 6px rgba(0,0,0,0.05);}
.card img{width:62px;height:62px;border-radius:50%;border:2px solid #ff6a00;}
.info{flex:1;text-align:center;}
.info h2{margin:0;font-size:17px;font-weight:800;color:#222;} /* صغرت الكلام */
.badge{background:#fff3e0;color:#ff6a00;padding:4px 9px;border-radius:14px;font-size:11px;font-weight:700;display:inline-block;margin:4px 0;}
.phone{color:#555;font-size:12.5px;font-weight:600;} /* صغرت الرقم */
.phone i{color:#ff6a00;margin-left:4px;}

/* 3. القايمة - صغرت الكلام */
.item{background:white;margin:8px 14px;border-radius:12px;padding:14px 12px;display:flex;justify-content:space-between;align-items:center;}
.item-left{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:700;color:#333;} /* صغرته */
.icon{width:38px;height:38px;background:#fff3e0;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#ff6a00;font-size:18px;}
.arrow{color:#ccc;font-size:12px;transform:rotate(180deg);}

.logout{margin:15px 14px;width:calc(100% - 28px);padding:13px;background:white;border:1.5px solid #ff6a00;color:#ff6a00;border-radius:11px;font-size:14.5px;font-weight:800;font-family:'Cairo';}

.nav{position:fixed;bottom:0;width:100%;background:white;display:flex;justify-content:space-around;padding:6px 0;border-top:1px solid #eee;}
.nav a{text-align:center;text-decoration:none;color:#999;font-size:10px;font-weight:600;}
.nav a.active{color:#ff6a00;}
.nav i{display:block;font-size:18px;margin-bottom:3px;}
</style>
</head>
<body>

<div class="top">
  <h1>حسابي</h1>
  <img src="logo-white.png" alt="سهلة">
</div>

<div class="card">
  <img src="avatar.png" id="riderImg">
  <div class="info">
    <h2 id="riderName"></h2> <!-- فاضي - هيتملى من التسجيل -->
    <div class="badge"><i class="fa-solid fa-user"></i> مندوب توصيل</div>
    <div class="phone"><i class="fa-solid fa-phone"></i> <span id="riderPhone"></span></div>
  </div>
</div>

<div class="item"><div class="item-left"><div class="icon"><i class="fa-regular fa-user"></i></div> البيانات الشخصيه</div><i class="fa-solid fa-chevron-left arrow"></i></div>
<div class="item" onclick="location='orders.html'"><div class="item-left"><div class="icon"><i class="fa-regular fa-file-lines"></i></div> سجل الطلبات</div><i class="fa-solid fa-chevron-left arrow"></i></div>
<div class="item"><div class="item-left"><div class="icon"><i class="fa-solid fa-coins"></i></div> الارباح</div><i class="fa-solid fa-chevron-left arrow"></i></div>
<div class="item"><div class="item-left"><div class="icon"><i class="fa-regular fa-wallet"></i></div> طريقه الدفع</div><i class="fa-solid fa-chevron-left arrow"></i></div>
<div class="item"><div class="item-left"><div class="icon"><i class="fa-solid fa-headset"></i></div> مساعده ودعم</div><i class="fa-solid fa-chevron-left arrow"></i></div>
<div class="item"><div class="item-left"><div class="icon"><i class="fa-solid fa-gear"></i></div> الإعدادات</div><i class="fa-solid fa-chevron-left arrow"></i></div>

<button class="logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</button>

<div class="nav">
  <a href="index.html"><i class="fa-solid fa-house"></i>الرئيسية</a>
  <a href="map.html"><i class="fa-solid fa-location-dot"></i>الموقع</a>
  <a href="orders.html"><i class="fa-regular fa-file-lines"></i>الطلبات</a>
  <a href="profile.html" class="active"><i class="fa-solid fa-user"></i>حسابي</a>
</div>

<script>
// 4. ليه مش بيسجل؟ عشان لازم اول ما تفتح index يشيك
var riderId = localStorage.getItem('riderId');
if(!riderId){ 
    window.location.href = 'login.html'; 
}

// يجيب الاسم والرقم من اللي اتسجلو
document.getElementById('riderName').innerText = localStorage.getItem('riderName_' + riderId);
document.getElementById('riderPhone').innerText = localStorage.getItem('riderPhone_' + riderId);

function logout(){
  localStorage.removeItem('riderId');
  window.location.href = 'login.html';
}
</script>
</body>
  </html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>حسابي - سهلة للتوصيل</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',Arial,sans-serif;-webkit-tap-highlight-color:transparent;}
    body{background:#f5f5f5;color:#222;min-height:100vh;}
    .app{width:100%;max-width:480px;min-height:100vh;margin:auto;background:#f5f5f5;overflow:hidden;padding-bottom:80px;}
    .header{height:85px;background:#ff7410;border-radius:0 0 28px 28px;position:relative;padding:0;overflow:hidden;}
    .logo-box{position:absolute;right:0;top:0;width:100%;height:100%;display:flex;align-items:center;}
    .logo-box img{width:100%;height:100%;object-fit:fill;}
    .content{padding:0 12px;margin-top:18px;position:relative;z-index:2;}
    .profile-card{background:#fff;border-radius:18px;min-height:110px;padding:16px 14px;box-shadow:0 4px 15px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:space-between;gap:12px;}
    .profile-info{flex:1;text-align:right;}
    .profile-name{font-size:17px;font-weight:800;margin-bottom:8px;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .role{display:inline-flex;align-items:center;gap:6px;background:#fff0dd;color:#ed6f0a;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:800;margin-bottom:6px;}
    .phone{direction:ltr;text-align:right;font-size:13px;color:#555;font-weight:600;}
    .phone-icon{color:#ef7410;font-size:14px;margin-right:5px;}
    .rider-photo{width:68px;height:68px;border-radius:50%;border:3px solid #f47716;padding:2px;background:#fff;object-fit:cover;flex:none;}
    .menu{margin-top:14px;display:flex;flex-direction:column;gap:10px;}
    .menu-item{width:100%;height:62px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;text-decoration:none;color:#222;box-shadow:0 2px 8px rgba(0,0,0,.03);}
    .menu-right{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;}
    .icon{width:38px;height:38px;border-radius:10px;background:#fff0dc;color:#ed7310;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;}
    .arrow{color:#cfcfcf;font-size:20px;}
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:65px;background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.06);display:grid;grid-template-columns:repeat(4,1fr);z-index:20;}
    .nav-item{text-decoration:none;color:#999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:700;}
    .nav-item .nav-icon{font-size:20px;line-height:1;}
    .nav-item.active{color:#ef7410;}
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo-box"><img src="logo-white.png" alt="سهلة للتوصيل"></div>
  </header>
  <main class="content">
    <section class="profile-card">
      <div class="profile-info">
        <div class="profile-name" id="riderName">محمد أحمد</div>
        <div class="role"><span>👤</span><span>مندوب توصيل</span></div>
        <div class="phone"><span id="riderPhone">01XXXXXXXXX</span><span class="phone-icon">☎</span></div>
        <!-- الرصيد وعدد الطلبات اللي كانو في الرئيسية - بقو هنا عشان riders.json يقرا لوحده -->
        <div style="margin-top:8px;display:flex;gap:8px;">
          <span style="background:#fff0dd;color:#ed6f0a;border-radius:12px;padding:2px 8px;font-size:11px;font-weight:800;">الرصيد: <b id="rBalance">130</b> جنيه</span>
          <span style="background:#eef8ff;color:#0a7aed;border-radius:12px;padding:2px 8px;font-size:11px;font-weight:800;">الطلبات: <b id="rOrders">0</b></span>
        </div>
      </div>
      <img class="rider-photo" src="rider.png" alt="صورة المندوب">
    </section>
    <section class="menu">
      <a class="menu-item" href="personal.html"><div class="menu-right"><div class="icon">👤</div><span>البيانات الشخصية</span></div><div class="arrow">‹</div></a>
      <a class="menu-item" href="orders.html"><div class="menu-right"><div class="icon">📄</div><span>سجل الطلبات</span></div><div class="arrow">‹</div></a>
      <a class="menu-item" href="earnings.html"><div class="menu-right"><div class="icon">🪙</div><span>الأرباح</span></div><div class="arrow">‹</div></a>
      <a class="menu-item" href="payment.html"><div class="menu-right"><div class="icon">💳</div><span>طريقة الدفع</span></div><div class="arrow">‹</div></a>
      <a class="menu-item" href="support.html"><div class="menu-right"><div class="icon">🎧</div><span>مساعدة ودعم</span></div><div class="arrow">‹</div></a>
      <a class="menu-item" href="#" onclick="logout(); return false;"><div class="menu-right"><div class="icon">↪</div><span>تسجيل الخروج</span></div><div class="arrow">‹</div></a>
    </section>
  </main>
</div>
<nav class="bottom-nav">
  <a class="nav-item active" href="profile.html"><div class="nav-icon">👤</div><div>حسابي</div></a>
  <a class="nav-item" href="orders.html"><div class="nav-icon">📄</div><div>الطلبات</div></a>
  <a class="nav-item" href="location.html"><div class="nav-icon">📍</div><div>الموقع</div></a>
  <a class="nav-item" href="index.html"><div class="nav-icon">🏠</div><div>الرئيسية</div></a>
</nav>
<script>
  const OWNER="wwweslamtarek567-netizen";
  const REPO="sahlah";
  const FILE_PATH="riders.json";
  // التوكن اتمسح - حطه هنا وقت الحفظ بس ومترفعوش على جيتهب
  const GITHUB_TOKEN = ""; 

  const savedName = localStorage.getItem("riderName");
  const savedPhone = localStorage.getItem("riderPhone");
  if (savedName) document.getElementById("riderName").textContent = savedName;
  if (savedPhone) document.getElementById("riderPhone").textContent = savedPhone;

  async function saveToGithub(content, msg){
    if(!GITHUB_TOKEN){ alert("حط التوكن في الكود عشان يحفظ"); return; }
    const getUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`;
    let sha = null;
    try{
      const r = await fetch(getUrl, {headers:{Authorization:`token ${GITHUB_TOKEN}`}});
      if(r.ok){ const j = await r.json(); sha = j.sha; }
    }catch(e){}
    const body = {message: msg, content: btoa(unescape(encodeURIComponent(content)))};
    if(sha) body.sha = sha;
    await fetch(getUrl, {method:"PUT", headers:{Authorization:`token ${GITHUB_TOKEN}`, "Content-Type":"application/json"}, body: JSON.stringify(body)});
  }

  // ==== ده الجزء اللي هيخلي riders.json الفاضي يقرا لوحده ====
  async function autoSync(){
    try{
      const res = await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${FILE_PATH}?t=${Date.now()}`);
      let all = await res.json();
      if(!Array.isArray(all)) all = [];

      const phone = (document.getElementById("riderPhone").textContent || savedPhone || "").trim();
      const name = (document.getElementById("riderName").textContent || savedName || "محمد أحمد").trim();
      const bal = parseInt(document.getElementById("rBalance").textContent) || 130;
      const ord = parseInt(document.getElementById("rOrders").textContent) || 0;

      if(all.length === 0){
        // الملف فاضي - امليه اوتوماتيك من البروفايل
        all.push({phone, name, balance: bal, orders_delivered: ord, status:"متاح", image:"rider.png"});
        await saveToGithub(JSON.stringify(all, null, 2), "انشاء اوتوماتيك من البروفايل - الملف كان فاضي");
        console.log("riders.json كان فاضي واتملى لوحده");
      }else{
        // الملف مليان - اعرض منه
        let rider = all.find(r => r.phone == phone) || all[0];
        document.getElementById("riderName").textContent = rider.name;
        document.getElementById("riderPhone").textContent = rider.phone;
        document.getElementById("rBalance").textContent = rider.balance;
        document.getElementById("rOrders").textContent = rider.orders_delivered;
      }
    }catch(e){ console.log("لسه riders.json فاضي", e); }
  }
  autoSync();

  // دالة الخصم تفضل شغالة زي ما هي
  window.onDeliver = async (price) => {
    const res = await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${FILE_PATH}?t=${Date.now()}`);
    let all = await res.json();
    let rider = all[0];
    rider.balance = (rider.balance || 0) - price;
    rider.orders_delivered = (rider.orders_delivered || 0) + 1;
    await saveToGithub(JSON.stringify(all, null, 2), `خصم ${price} - رصيد ${rider.balance}`);
    location.reload();
  }

  function logout(){
    localStorage.clear();
    window.location.href="register.html";
  }
</script>
</body>
    </html>

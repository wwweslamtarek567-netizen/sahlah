<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>حسابي - سهلة للتوصيل</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',Arial,sans-serif;-webkit-tap-highlight-color:transparent;}
    body{background:#f5f5f5;color:#222;min-height:100vh;}
    .app{width:100%;max-width:480px;min-height:100vh;margin:auto;background:#f5f5f5;overflow:hidden;padding-bottom:80px;}
    .header{height:85px;background:#ff7410;border-radius:0 0 28px 28px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 15px;}
    .logo-box{position:absolute;right:0;top:0;width:100%;height:100%;display:flex;align-items:center;z-index:1;}
    .logo-box img{width:100%;height:100%;object-fit:fill;}
    .settings-btn{position:relative;z-index:2;background:rgba(0,0,0,.2);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:20px;cursor:pointer;border:none;}
    .content{padding:0 12px;margin-top:18px;}
    .profile-card{background:#fff;border-radius:18px;min-height:110px;padding:16px 14px;box-shadow:0 4px 15px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:space-between;gap:12px;}
    .profile-info{flex:1;text-align:right;}
    .profile-name{font-size:17px;font-weight:800;margin-bottom:8px;}
    .role{display:inline-flex;align-items:center;gap:6px;background:#fff0dd;color:#ed6f0a;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:800;margin-bottom:6px;}
    .phone{direction:ltr;text-align:right;font-size:13px;color:#555;font-weight:600;}
    .phone-icon{color:#ef7410;font-size:14px;margin-right:5px;}
    .rider-photo{width:68px;height:68px;border-radius:50%;border:3px solid #f47716;padding:2px;background:#fff;object-fit:cover;}
    .menu{margin-top:14px;display:flex;flex-direction:column;gap:10px;}
    .menu-item{width:100%;height:62px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;text-decoration:none;color:#222;box-shadow:0 2px 8px rgba(0,0,0,.03);cursor:pointer;border:none;}
    .menu-right{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;}
    .icon{width:38px;height:38px;border-radius:10px;background:#fff0dc;color:#ed7310;display:flex;align-items:center;justify-content:center;font-size:18px;}
    .arrow{color:#cfcfcf;font-size:20px;}
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:65px;background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.06);display:grid;grid-template-columns:repeat(4,1fr);z-index:20;}
    .nav-item{text-decoration:none;color:#999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:700;}
    .nav-item .nav-icon{font-size:20px;}
    .nav-item.active{color:#ef7410;}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:15px;}
    .modal.show{display:flex;}
    .modal-box{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:360px;}
    .modal-box h3{margin-bottom:12px;font-size:16px;}
    .modal-box input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-family:'Cairo';direction:ltr;}
    .modal-actions{display:flex;gap:10px;margin-top:12px;}
    .btn-save{flex:1;background:#ff7410;color:white;border:none;border-radius:12px;padding:12px;font-family:'Cairo';font-weight:800;cursor:pointer;}
    .btn-close{flex:1;background:#eee;color:#333;border:none;border-radius:12px;padding:12px;font-family:'Cairo';font-weight:700;cursor:pointer;}
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo-box"><img src="logo-white.png" alt="سهلة"></div>
    <button class="settings-btn" onclick="openSettings()">⚙️</button>
  </header>
  <main class="content">
    <section class="profile-card">
      <div class="profile-info">
        <div class="profile-name" id="riderName">محمد أحمد</div>
        <div class="role"><span>👤</span><span>مندوب توصيل</span></div>
        <div class="phone"><span id="riderPhone">01XXXXXXXXX</span><span class="phone-icon">☎</span></div>
        <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">
          <span style="background:#fff0dd;color:#ed6f0a;border-radius:12px;padding:2px 8px;font-size:11px;font-weight:800;">الرصيد: <b id="rBalance">50</b> جنيه</span>
          <span style="background:#e8f8ee;color:#0ab04a;border-radius:12px;padding:2px 8px;font-size:11px;font-weight:800;">الطلبات المستلمه: <b id="rDelivered">0</b></span>
          <span style="background:#fde8e8;color:#e53935;border-radius:12px;padding:2px 8px;font-size:11px;font-weight:800;">الطلبات الملغاه: <b id="rCancelled">0</b></span>
        </div>
      </div>
      <img class="rider-photo" src="rider.png" alt="صورة المندوب">
    </section>
    <section class="menu">
      <a class="menu-item" href="personal.html"><div class="menu-right"><div class="icon">👤</div><span>البيانات الشخصية</span></div><div class="arrow">‹</div></a>
      <a class="menu-item" href="orders.html"><div class="menu-right"><div class="icon">📄</div><span>سجل الطلبات</span></div><div class="arrow">‹</div></a>
      <a class="menu-item" href="earnings.html"><div class="menu-right"><div class="icon">🪙</div><span>الأرباح</span></div><div class="arrow">‹</div></a>
      <a class="menu-item" href="payment.html"><div class="menu-right"><div class="icon">💳</div><span>طريقة الدفع</span></div><div class="arrow">‹</div></a>
      <a class="menu-item" href="support.html"><div class="menu-right"><div class="icon">🎧</div><span>مساعدة ودعم</span></div><div class="arrow">‹</div></a>
      <button class="menu-item" onclick="openSettings()"><div class="menu-right"><div class="icon">⚙️</div><span>الاعدادات وربط لوحة التحكم</span></div><div class="arrow">‹</div></button>
      <a class="menu-item" href="#" onclick="logout(); return false;"><div class="menu-right"><div class="icon">↪</div><span>تسجيل الخروج</span></div><div class="arrow">‹</div></a>
    </section>
  </main>
</div>

<div class="modal" id="settingsModal">
  <div class="modal-box">
    <h3>⚙️ اعدادات الربط</h3>
    <p style="font-size:12px;color:#666;margin-bottom:8px;">حط توكن GitHub هنا (هيتخزن في جهازك بس)</p>
    <input id="tokenInput" placeholder="ghp_xxxxxxxxxxxx">
    <div class="modal-actions">
      <button class="btn-save" onclick="saveToken()">حفظ</button>
      <button class="btn-close" onclick="closeSettings()">اغلاق</button>
    </div>
    <div id="tokenStatus" style="font-size:11px;margin-top:8px;color:#0ab04a;"></div>
  </div>
</div>

<nav class="bottom-nav">
  <a class="nav-item active" href="profile.html"><div class="nav-icon">👤</div><div>حسابي</div></a>
  <a class="nav-item" href="orders.html"><div class="nav-icon">📄</div><div>الطلبات</div></a>
  <a class="nav-item" href="map.html"><div class="nav-icon">📍</div><div>الموقع</div></a>
  <a class="nav-item" href="index.html"><div class="nav-icon">🏠</div><div>الرئيسية</div></a>
</nav>

<script>
const OWNER="wwweslamtarek567-netizen";
const REPO="sahlah";
const FILE_PATH="riders.json";
var riderId = localStorage.getItem('riderId');

function getToken(){ return localStorage.getItem('github_token') || localStorage.getItem('gh_token') || ""; }
function cleanP(p){ return String(p||'').replace(/\D/g,'').replace(/^0+/,''); }
function getBalance(){ return parseFloat(localStorage.getItem('balance_' + riderId)) || 50; }
function getDelivered(){ return parseInt(localStorage.getItem('delivered_' + riderId) || 0); }
function getCancelled(){ return parseInt(localStorage.getItem('cancelled_' + riderId) || 0); }

if(riderId){
  if(localStorage.getItem('balance_' + riderId) === null) localStorage.setItem('balance_' + riderId, 50);
  if(localStorage.getItem('delivered_' + riderId) === null) localStorage.setItem('delivered_' + riderId, 0);
  if(localStorage.getItem('cancelled_' + riderId) === null) localStorage.setItem('cancelled_' + riderId, 0);
}

async function syncFromAdmin(){
  try{
    const res = await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${FILE_PATH}?t=${Date.now()}`);
    if(!res.ok) return null;
    const riders = await res.json();
    if(!Array.isArray(riders)) return [];
    const me = riders.find(r=> cleanP(r.phone)==cleanP(riderId) || r.id==riderId);
    if(me){
      let localBal = parseFloat(localStorage.getItem('balance_' + riderId) || 50);
      if(me.name) localStorage.setItem('riderName', me.name);
      // لو السيرفر فيه رصيد اكبر = الادمن شحن
      if(me.balance != null){
        let remoteBal = parseFloat(me.balance);
        if(remoteBal > localBal){
          localStorage.setItem('balance_' + riderId, remoteBal);
        }
      }
      // الطلبات لو السيرفر اكبر خدها
      if(me.delivered != null && parseInt(me.delivered) > parseInt(localStorage.getItem('delivered_' + riderId) || 0)){
        localStorage.setItem('delivered_' + riderId, me.delivered);
      }
      if(me.cancelled != null && parseInt(me.cancelled) > parseInt(localStorage.getItem('cancelled_' + riderId) || 0)){
        localStorage.setItem('cancelled_' + riderId, me.cancelled);
      }
    }
    return riders;
  }catch(e){ return null; }
}

async function pushToAdmin(){
  const token = getToken();
  if(!token){ document.getElementById('tokenStatus').innerText="حط التوكن الاول ⚠️"; return; }
  if(!riderId){ alert('مفيش riderId'); return; }
  try{
    const getRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`,{
      headers:{Authorization:`Bearer ${token}`}
    });
    if(!getRes.ok) throw "get failed";
    const fileData = await getRes.json();
    let content = [];
    try{ content = JSON.parse(decodeURIComponent(escape(atob(fileData.content)))); }catch(e){ content=[]; }
    if(!Array.isArray(content)) content=[];
    let me = content.find(r=> cleanP(r.phone)==cleanP(riderId) || r.id==riderId);
    if(me){
      me.balance = getBalance();
      me.delivered = getDelivered();
      me.cancelled = getCancelled();
    } else {
      content.push({phone:riderId, balance:getBalance(), delivered:getDelivered(), cancelled:getCancelled(), name: localStorage.getItem('riderName')||"مندوب", status:"متاح"});
    }
    const putRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`,{
      method:"PUT",
      headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json"},
      body: JSON.stringify({
        message:`update profile ${riderId}`,
        content: btoa(unescape(encodeURIComponent(JSON.stringify(content,null,2)))),
        sha: fileData.sha
      })
    });
    if(putRes.ok) document.getElementById('tokenStatus').innerText = "✓ تم الرفع للوحة التحكم";
  }catch(e){ document.getElementById('tokenStatus').innerText = "خطأ في التوكن"; }
}

function updateUI(){
  if(!riderId) return;
  document.getElementById('rBalance').innerText = getBalance().toFixed(2);
  document.getElementById('rDelivered').innerText = getDelivered();
  document.getElementById('rCancelled').innerText = getCancelled();
  const savedName = localStorage.getItem('riderName');
  const savedPhone = localStorage.getItem('riderPhone') || riderId;
  if(savedName) document.getElementById('riderName').innerText = savedName;
  if(savedPhone) document.getElementById('riderPhone').innerText = savedPhone;
  document.getElementById('tokenInput').value = getToken();
  if(getToken()) document.getElementById('tokenStatus').innerText = "التوكن محفوظ ✓";
}

function openSettings(){ document.getElementById('settingsModal').classList.add('show'); }
function closeSettings(){ document.getElementById('settingsModal').classList.remove('show'); }
function saveToken(){
  const t = document.getElementById('tokenInput').value.trim();
  if(!t) return;
  localStorage.setItem('github_token', t);
  localStorage.setItem('gh_token', t);
  document.getElementById('tokenStatus').innerText = "تم الحفظ ✓ جاري الرفع...";
  pushToAdmin();
}

window.onload = async function(){
  await syncFromAdmin();
  updateUI();
};
window.onfocus = async function(){ await syncFromAdmin(); updateUI(); };
setInterval(updateUI, 1000);

function logout(){ localStorage.removeItem('riderId'); window.location.href="register.html"; }
</script>
</body>
  </html>

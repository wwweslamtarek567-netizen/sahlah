<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>حسابي - سهلة للتوصيل</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',Arial,sans-serif;-webkit-tap-highlight-color:transparent;}
    body{background:#f5f5f5;color:#222;min-height:100vh;}
    .app{width:100%;max-width:480px;min-height:100vh;margin:auto;background:#f5f5f5;overflow:hidden;padding-bottom:80px;}

    /* الهيدر */
    .header{
      height:140px;
      background:#ff7410;
      border-radius:0 0 28px 28px;
      position:relative;
      padding:0 16px;
    }
    .header-title{color:#fff;font-size:22px;font-weight:800;position:absolute;left:16px;top:22px;}

    /* === اللوجو اتظبط هنا بس === */
    .logo-box{
      position:absolute;
      right:0px;
      top:14px;
      width:165px;
      height:32px;
      display:flex;
      align-items:center;
      justify-content:flex-end;
    }
    .logo-box img{
      width:100%;
      height:100%;
      object-fit:contain;
      object-position:right center;
    }

    /* كارت المندوب */
    .content{padding:0 12px;margin-top:-35px;position:relative;z-index:2;}
    .profile-card{
      background:#fff;
      border-radius:18px;
      min-height:110px;
      padding:16px 14px;
      box-shadow:0 4px 15px rgba(0,0,0,.06);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .profile-info{flex:1;text-align:right;}
    .profile-name{font-size:17px;font-weight:800;margin-bottom:8px;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .role{display:inline-flex;align-items:center;gap:6px;background:#fff0dd;color:#ed6f0a;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:800;margin-bottom:6px;}
    .phone{direction:ltr;text-align:right;font-size:13px;color:#555;font-weight:600;}
    .phone-icon{color:#ef7410;font-size:14px;margin-right:5px;}
    .rider-photo{width:68px;height:68px;border-radius:50%;border:3px solid #f47716;padding:2px;background:#fff;object-fit:cover;flex:none;}

    /* القائمة */
    .menu{margin-top:14px;display:flex;flex-direction:column;gap:10px;}
    .menu-item{
      width:100%;height:62px;background:#fff;border-radius:14px;
      display:flex;align-items:center;justify-content:space-between;
      padding:0 12px;text-decoration:none;color:#222;
      box-shadow:0 2px 8px rgba(0,0,0,.03);
    }
    .menu-right{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;}
    .icon{width:38px;height:38px;border-radius:10px;background:#fff0dc;color:#ed7310;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;}
    .arrow{color:#cfcfcf;font-size:20px;}

    /* الفوتر */
    .bottom-nav{
      position:fixed;bottom:0;left:50%;transform:translateX(-50%);
      width:100%;max-width:480px;height:65px;
      background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.06);
      display:grid;grid-template-columns:repeat(4,1fr);z-index:20;
    }
    .nav-item{text-decoration:none;color:#999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:700;}
    .nav-item .nav-icon{font-size:20px;line-height:1;}
    .nav-item.active{color:#ef7410;}
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-title">حسابي</div>
    <div class="logo-box"><img src="logo-white.png" alt="سهلة للتوصيل"></div>
  </header>

  <main class="content">
    <section class="profile-card">
      <div class="profile-info">
        <div class="profile-name" id="riderName">محمد أحمد</div>
        <div class="role"><span>👤</span><span>مندوب توصيل</span></div>
        <div class="phone"><span id="riderPhone">01XXXXXXXXX</span><span class="phone-icon">☎</span></div>
      </div>
      <img class="rider-photo" src="rider.png" alt="صورة المندوب">
    </section>

    <section class="menu">
      <a class="menu-item" href="personal.html"><div class="menu-right"><div class="icon">👤</div><span>البيانات الشخصية</span></div><div class="arrow">‹</div></a>
      <a class="menu-item" href="orders.html"><div class="menu-right"><div class="icon">📄</div><span>سجل الطلبات</span></div><div class="arrow">‹</div></a>
      <a class="menu-item" href="earnings.html"><div class="menu-right"><div class="icon">🪙</div><span>الأرباح</span></div><div class="arrow">‹</div></a>
      <a class="menu-item" href="payment.html"><div class="menu-right"><div class="icon">💳</div><span>طريقة الدفع</span></div><div class="arrow">‹</div></a>
      <a class="menu-item" href="support.html"><div class="menu-right"><div class="icon">🎧</div><span>مساعدة ودعم</span></div><div class="arrow">‹</div></a>
      <a class="menu-item" href="#" onclick="logout(); return false;"><div class="menu-right"><div class="icon">↪</div><span>تسجيل الخروج</span></div><div class="arrow">‹</div></a>
    </section>
  </main>
</div>

<nav class="bottom-nav">
  <a class="nav-item active" href="profile.html"><div class="nav-icon">👤</div><div>حسابي</div></a>
  <a class="nav-item" href="orders.html"><div class="nav-icon">📄</div><div>الطلبات</div></a>
  <a class="nav-item" href="location.html"><div class="nav-icon">📍</div><div>الموقع</div></a>
  <a class="nav-item" href="home.html"><div class="nav-icon">🏠</div><div>الرئيسية</div></a>
</nav>

<script>
  const savedName = localStorage.getItem("riderName");
  const savedPhone = localStorage.getItem("riderPhone");
  if (savedName) document.getElementById("riderName").textContent = savedName;
  if (savedPhone) document.getElementById("riderPhone").textContent = savedPhone;
  function logout(){
    localStorage.removeItem("riderName");
    localStorage.removeItem("riderPhone");
    window.location.href = "login.html";
  }
</script>
</body>
  </html>

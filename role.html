<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سهلة - نوع الحساب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background:#fff;min-height:100vh}
.container{padding:24px 18px;max-width:400px;margin:0 auto}
.logo-wrap{text-align:center;margin-top:70px;margin-bottom:40px}
.logo-icon{font-size:80px;color:#ff7a00}
.logo-text{font-size:42px;font-weight:900;color:#ff7a00}
.title{text-align:center;font-size:26px;font-weight:900;margin-bottom:8px}
.subtitle{text-align:center;font-size:13px;color:#b0b0b0;font-weight:600;margin-bottom:45px}
.card{background:#fff7f0;border:1.5px solid #ffe0c2;border-radius:22px;padding:18px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;cursor:pointer}
.card:active{transform:scale(.97);background:#ffead2}
.card-right{display:flex;align-items:center;gap:14px}
.card-icon{width:56px;height:56px;background:#ffe8d1;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#ff7a00;font-size:22px}
.card-text h3{font-size:17px;font-weight:900}
.card-text p{font-size:12px;color:#9a9a9a;font-weight:600;margin-top:2px}
.arrow{color:#c7c7c7}
</style>
</head>
<body>
<div class="container">
  <div class="logo-wrap">
    <div class="logo-icon">🛵</div>
    <div class="logo-text">سهلة</div>
  </div>
  <div class="title">حدد نوع حسابك</div>
  <div class="subtitle">أهلاً بك في سهلة. كيف تود استخدام التطبيق؟</div>

  <div class="card" onclick="goClient()">
    <div class="card-right">
      <div class="card-icon"><i class="fa-solid fa-user"></i></div>
      <div class="card-text"><h3>أنا عميل</h3><p>أطلب دليفري سريع من مدينتي</p></div>
    </div>
    <i class="fa-solid fa-chevron-left arrow"></i>
  </div>

  <div class="card" onclick="goRider()">
    <div class="card-right">
      <div class="card-icon">سهلة</div>
      <div class="card-text"><h3>أنا دليفري</h3><p>سجل لتوصيل الطلبات وتحقيق دخل</p></div>
    </div>
    <i class="fa-solid fa-chevron-left arrow"></i>
  </div>
</div>

<script>
function goClient(){
  localStorage.setItem('sahla_role','client');
  window.location.href = 'register-client.html';
}
function goRider(){
  localStorage.setItem('sahla_role','rider');
  window.location.href = 'register.html'; // بتاعة المندوب اللي عملناها قبل كده
}
</script>
</body>
    </html>

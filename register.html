<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل</title>
  <style>
    body { margin: 0; background: linear-gradient(to bottom, #ff6b00 45%, white 45%); font-family: 'Cairo', sans-serif; }
   .register-img { text-align: center; padding-top: 30px; }
   .register-img img { width: 90%; }
   .form { background: white; border-radius: 30px 30px 0 0; padding: 30px 20px; }
   .form h2 { color: #ff6b00; text-align: center; margin-bottom: 20px; }
    input { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 15px; font-size: 16px; }
   .options { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 20px 0; }
   .option { border: 2px solid #ddd; border-radius: 10px; padding: 15px 5px; text-align: center; cursor: pointer; }
   .option.active { border-color: #ff6b00; background: #fff3e8; }
   .main-btn { background: #ff6b00; color: white; width: 100%; padding: 15px; border: none; border-radius: 15px; font-size: 18px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="register-img">
    <img src="https://i.imgur.com/ZK6fN8L.png" alt="">
  </div>
  <div class="form">
    <h2>تسجيل مندوب جديد</h2>
    <input type="text" placeholder="الاسم الكامل">
    <input type="number" placeholder="السن">
    <input type="text" placeholder="العنوان">
    <p style="text-align:center; margin:15px 0;">معاك ايه ؟</p>
    <div class="options">
      <div class="option" onclick="this.classList.toggle('active')">🚶<br>على رجلك</div>
      <div class="option" onclick="this.classList.toggle('active')">🚲<br>عجلة</div>
      <div class="option" onclick="this.classList.toggle('active')">🏍️<br>موتوسيكل</div>
    </div>
    <button class="main-btn">تسجيل</button>
    <p style="text-align:center; margin-top:15px;">لديك حساب ؟ <a href="#" style="color:#ff6b00">تسجيل دخول</a></p>
  </div>
</body>
</html>

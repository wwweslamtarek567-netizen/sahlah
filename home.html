<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سهلة</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#ff6a00;min-height:100vh;padding-bottom:20px}
.top{padding:15px 20px;display:flex;justify-content:space-between;color:white;font-size:24px}
.logo{text-align:center;color:white;margin-bottom:20px}
.logo .icon{font-size:35px;font-weight:900}
.logo h1{font-size:45px;font-weight:900;line-height:1}
.logo p{font-size:14px;margin-top:3px}
.card{background:white;border-radius:14px;padding:16px 18px;margin:10px 15px;display:flex;align-items:center;justify-content:space-between}
.card h3{font-size:17px;font-weight:700}
.card p{font-size:14px;color:#666;margin-top:5px}
.dot{display:inline-block;width:10px;height:10px;background:#22c55e;border-radius:50%;margin-right:6px}
.card img{width:48px;height:48px;border-radius:50%;object-fit:cover}
.balance .right{text-align:center}
.balance .num{font-size:48px;color:#ff6a00;font-weight:900;line-height:1}
.balance .icon{font-size:35px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 15px}
.box{background:white;border-radius:14px;padding:22px 10px;text-align:center;font-weight:700;color:#333}
.box .icon{font-size:30px;margin-bottom:8px;display:block}
.gps{border:2px solid white;color:white;border-radius:14px;padding:16px;text-align:center;margin:10px 15px;font-weight:700;font-size:16px}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="top">
  <div>☰</div>
  <div>🔔</div>
</div>

<div class="logo">
  <div class="icon">🏍️</div>
  <h1>سهلة</h1>
  <p>التوصيل بقي أسهل</p>
</div>

<div class="card">
  <div>
    <h3>أنت الآن</h3>
    <p>متاح للعمل<span class="dot"></span></p>
  </div>
  <img src="https://i.imgur.com/Q3aQYp9.png" alt="مندوب">
</div>

<div class="card balance">
  <div class="right">
    <h3>رصيدك الحالي</h3>
    <div class="num">250</div>
    <p>جنيه</p>
  </div>
  <div class="icon">💼</div>
</div>

<div class="grid">
  <div class="box"><span class="icon">📋</span>طلباتي</div>
  <div class="box"><span class="icon">🛍️</span>الطلبات الجديدة</div>
  <div class="box"><span class="icon">⭐</span>الأداء والتقييم</div>
  <div class="box"><span class="icon">💰</span>محفظتي</div>
</div>

<div class="gps" onclick="window.location='map.html'">📍 تحديث موقعي</div>

</body>
    </html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلبات التوصيل - سهلة</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:'Cairo';background:#f7f7f7;padding-bottom:90px}
.header{background:#ff6a00;padding:15px;text-align:center;position:relative;color:white}
.header.back{position:absolute;right:15px;top:18px;font-size:20px;color:white;cursor:pointer}
.logo{font-size:20px;font-weight:900}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;background:white;border-bottom:1px solid #eee}
.map-wrap{position:relative;margin:12px 15px;border-radius:18px;overflow:hidden;border:2px solid #ff6a00;height:260px;display:none}
#miniMap{height:100%;width:100%;z-index:1}
.dist-badge{position:absolute;top:10px;left:10px;z-index:999;background:#ff6a00;color:white;padding:6px 14px;border-radius:20px;font-weight:900;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.loc-badge{position:absolute;top:10px;right:10px;z-index:999;background:#0a9e3f;color:white;padding:6px 14px;border-radius:20px;font-weight:800;font-size:11px}
.order-card{background:white;margin:12px 15px;padding:15px;border-radius:18px;box-shadow:0 3px 12px rgba(0,0,0,.06);border-right:5px solid #ff6a00}
.route{display:flex;align-items:center;gap:10px;margin:10px 0}
.route.line{width:3px;height:40px;background:#ff6a00;border-radius:10px;position:relative}
.route.line::before{content:'';width:12px;height:12px;background:#0a9e3f;border-radius:50%;position:absolute;top:-2px;left:-4px}
.route.line::after{content:'';width:12px;height:12px;background:#d00;border-radius:50%;position:absolute;bottom:-2px;left:-4px}
.loc{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.loc small{display:block;color:#666;font-weight:600;font-size:12px}
.info-row{display:flex;justify-content:space-between;margin:8px 0;font-size:13px;color:#444}
.badge{background:#fff3e0;color:#ff6a00;padding:4px 10px;border-radius:20px;font-weight:800;font-size:12px}
.expire-bar{background:#fff0f0;border:1px dashed #d00;border-radius:10px;padding:6px;text-align:center;font-weight:900;font-size:12px;margin-top:8px}
.expire-bar span{color:#d00;font-size:15px}
.btn-accept{background:#ff6a00;color:white;border:none;width:100%;padding:13px;border-radius:30px;font-family:'Cairo';font-weight:900;font-size:15px;cursor:pointer;margin-top:10px}
.btn-accept:disabled{background:#ccc}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:10px 0;box-shadow:0 -2px 10px rgba(0,0,0,.08)}
.nav-item{text-align:center;color:#999;font-size:12px;text-decoration:none}
.nav-item.active{color:#ff6a00;font-weight:800}
.nav-item i{font-size:22px;display:block;margin-bottom:2px}
</style>
</head>
<body>

<div class="header">
  <i class="fa-solid fa-arrow-right back" onclick="history.back()"></i>
  <div class="logo">🏍️ طلبات التوصيل</div>
</div>

<div class="top-bar">
  <div style="color:#ff6a00;font-weight:800" id="countOrders">0 طلبات</div>
  <div style="font-weight:800">رصيدك: <span id="bal">0</span> ج</div>
</div>

<div class="map-wrap" id="mapWrap">
  <div id="miniMap"></div>
  <div class="dist-badge" id="distText">0 كم</div>
  <div class="loc-badge">🟢 استلام → 🔴 تسليم</div>
</div>

<div id="ordersList" style="margin-top:10px"></div>

<div class="bottom-nav">
  <a href="profile.html" class="nav-item"><i class="fa-regular fa-user"></i>حسابي</a>
  <a href="orders.html" class="nav-item active"><i class="fa-solid fa-list"></i>التوصيل</a>
  <a href="map.html" class="nav-item"><i class="fa-regular fa-location-dot"></i>الموقع</a>
  <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i>الرئيسية</a>
</div>

<script>
function clean(p){return String(p||'').replace(/\D/g,'');}
let riderKey = clean(localStorage.getItem('riderPhone')||'');
const FIVE_HOURS = 5*60*60*1000;
let map, routeLine, markers=[];

function getCreatedTime(o){
  let v = o?.createdAt?? o?.timestamp?? o?.time?? o?.id?? 0;
  if(!v) return Date.now();
  let num = parseInt(v);
  if(!isNaN(num) && num > 1e12) return num;
  if(!isNaN(num) && num > 1e9) return num*1000;
  let d = Date.parse(v);
  return isNaN(d)? Date.now() : d;
}
function calcKm(lat1,lon1,lat2,lon2){
  let R=6371; let dLat=(lat2-lat1)*Math.PI/180; let dLon=(lon2-lon1)*Math.PI/180;
  let a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function initMap(pickLat, pickLng, dropLat, dropLng){
  let wrap = document.getElementById('mapWrap');
  wrap.style.display='block';
  if(!map){
    map = L.map('miniMap').setView([pickLat, pickLng], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  }
  markers.forEach(m=>{ try{map.removeLayer(m)}catch(e){} });
  markers=[];
  if(routeLine) map.removeLayer(routeLine);

  let fromIcon = L.divIcon({html:'<div style="background:#0a9e3f;color:white;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-weight:900;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,.3)">A</div>',className:'',iconSize:[32,32],iconAnchor:[16,16]});
  let toIcon = L.divIcon({html:'<div style="background:#d00;color:white;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-weight:900;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,.3)">B</div>',className:'',iconSize:[32,32],iconAnchor:[16,16]});

  let m1 = L.marker([pickLat, pickLng], {icon:fromIcon}).addTo(map).bindPopup('مكان الاستلام');
  let m2 = L.marker([dropLat, dropLng], {icon:toIcon}).addTo(map).bindPopup('مكان التسليم');
  markers.push(m1,m2);

  routeLine = L.polyline([[pickLat,pickLng],[dropLat,dropLng]], {color:'#ff6a00', weight:5, opacity:0.9, dashArray:'10,10'}).addTo(map);

  let km = calcKm(pickLat,pickLng,dropLat,dropLng).toFixed(1);
  document.getElementById('distText').innerText = km+' كم مسافة التوصيل';

  map.fitBounds([[pickLat,pickLng],[dropLat,dropLng]], {padding:[40,40]});
  setTimeout(()=>map.invalidateSize(), 300);
}

async function loadDeliveryOrders(){
  try{
    let res = await fetch(DB_URL+'/orders.json?t='+Date.now());
    let data = await res.json();
    let list = document.getElementById('ordersList');
    list.innerHTML='';
    if(!data){ document.getElementById('countOrders').innerText='لا يوجد طلبات'; return; }

    let orders = Object.entries(data).map(([fbId,v])=>({...v, fbId})).filter(o=>{
      if(!o) return false;
      let type = (o.type||o.service||'').toLowerCase();
      let isDelivery = type.includes('tawseel') || type.includes('delivery') || type.includes('توصيل') || o.isParcel==true || o.deliveryType=='p2p';
      if(!isDelivery) return false;
      if(o.courier) return false;
      if((o.status||'pending')!='pending') return false;
      let created = getCreatedTime(o);
      if(Date.now() - created > FIVE_HOURS){
        fetch(DB_URL+'/orders/'+o.fbId+'.json',{method:'DELETE'});
        return false;
      }
      return true;
    }).sort((a,b)=>getCreatedTime(b)-getCreatedTime(a));

    document.getElementById('countOrders').innerText = orders.length+' طلبات توصيل';

    if(orders.length==0){
      document.getElementById('mapWrap').style.display='none';
      list.innerHTML = '<div style="text-align:center;padding:40px;color:#999"><i class="fa-solid fa-box-open" style="font-size:40px"></i><br><br>مفيش طلبات توصيل حاليا</div>';
      return;
    }

    let first = orders[0];
    let pLat = parseFloat(first.pickupLat || first.clientLat || first.fromLat || first.lat || 0);
    let pLng = parseFloat(first.pickupLng || first.clientLng || first.fromLng || first.lng || 0);
    let dLat = parseFloat(first.dropoffLat || first.toLat || 0);
    let dLng = parseFloat(first.dropoffLng || first.toLng || 0);
    if(pLat && dLat){
      initMap(pLat,pLng,dLat,dLng);
    }else if(pLat){
      document.getElementById('mapWrap').style.display='block';
      if(!map){
        map = L.map('miniMap').setView([pLat,pLng], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      }
      document.getElementById('distText').innerText = 'موقع الاستلام';
    }

    orders.forEach(o=>{
      let created = getCreatedTime(o);
      let remain = FIVE_HOURS - (Date.now() - created);
      let h=Math.floor(remain/3600000), m=Math.floor((remain%3600000)/60000), s=Math.floor((remain%60000)/1000);
      let remainStr = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      let from = o.pickupAddress || o.fromAddress || o.clientAddress || 'مكان الاستلام';
      let to = o.dropoffAddress || o.toAddress || o.receiverAddress || 'مكان التسليم';
      let pkg = o.packageDesc || o.packageName || 'طرد';
      let fLat = parseFloat(o.pickupLat||o.clientLat||0), fLng=parseFloat(o.pickupLng||o.clientLng||0);
      let tLat = parseFloat(o.dropoffLat||o.toLat||0), tLng=parseFloat(o.dropoffLng||o.toLng||0);
      let kmText = (fLat && tLat)? calcKm(fLat,fLng,tLat,tLng).toFixed(1)+' كم' : 'داخل المدينة';

      let card = document.createElement('div');
      card.className='order-card';
      card.innerHTML = `
        <div style="display:flex;justify-content:space-between">
          <span class="badge"><i class="fa-solid fa-motorcycle"></i> ${kmText}</span>
          <span style="font-weight:900;color:#ff6a00">${o.total||o.fee||40} جنيه</span>
        </div>
        <div class="route">
          <div class="line"></div>
          <div style="flex:1">
            <div class="loc">🟢 ${from}<small>مرسل: ${o.senderName||o.clientName||''} - ${o.senderPhone||''}</small></div>
            <div style="height:15px"></div>
            <div class="loc">🔴 ${to}<small>مستلم: ${o.receiverName||''} - ${o.receiverPhone||''}</small></div>
          </div>
        </div>
        <div class="info-row"><span><i class="fa-solid fa-box"></i> ${pkg}</span><span>${o.weight||''}</span></div>
        <div class="expire-bar">⏳ ينتهي بعد: <span class="timer" data-created="${created}" data-id="${o.fbId}">${remainStr}</span></div>
        <button class="btn-accept" onclick="sendOffer('${o.fbId}', '${o.total||o.fee||40}')"><i class="fa-solid fa-paper-plane"></i> ارسال عرض - ${o.total||o.fee||40} جنيه</button>
        <button class="btn-accept" style="background:#fff;color:#ff6a00;border:2px solid #ff6a00;margin-top:6px" onclick="showOnMap('${o.fbId}')"><i class="fa-solid fa-map-location-dot"></i> عرض على الخريطة</button>
      `;
      list.appendChild(card);
    });

  }catch(e){console.log(e)}
}

function showOnMap(fbId){
  fetch(DB_URL+'/orders/'+fbId+'.json').then(r=>r.json()).then(o=>{
    if(!o) return;
    let pLat = parseFloat(o.pickupLat||o.clientLat||0), pLng=parseFloat(o.pickupLng||o.clientLng||0);
    let dLat = parseFloat(o.dropoffLat||o.toLat||0), dLng=parseFloat(o.dropoffLng||o.toLng||0);
    if(pLat && dLat) initMap(pLat,pLng,dLat,dLng);
    window.scrollTo({top:0, behavior:'smooth'});
  });
}

function startCountdown(){
  setInterval(()=>{
    document.querySelectorAll('.timer').forEach(el=>{
      let created = parseInt(el.dataset.created);
      let id = el.dataset.id;
      let remain = FIVE_HOURS - (Date.now() - created);
      if(remain<=0){
        fetch(DB_URL+'/orders/'+id+'.json',{method:'DELETE'});
        el.closest('.order-card')?.remove();
      }else{
        let h=Math.floor(remain/3600000), m=Math.floor((remain%3600000)/60000), s=Math.floor((remain%60000)/1000);
        el.innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      }
    });
  },1000);
}

async function sendOffer(fbId, orderFee){
  let riderName = localStorage.getItem('riderName')||'مندوب سهلة';
  let btn = event.target;
  btn.disabled = true;
  btn.innerText = 'جاري ارسال العرض...';
  let lat=30.0444, lng=31.2357;
  try{
    let pos = await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:4000}));
    lat=pos.coords.latitude; lng=pos.coords.longitude;
  }catch(e){}
  let orderSnap = await fetch(DB_URL+'/orders/'+fbId+'.json').then(r=>r.json());
  let pLat = parseFloat(orderSnap.pickupLat||orderSnap.fromLat||orderSnap.clientLat||0);
  let pLng = parseFloat(orderSnap.pickupLng||orderSnap.fromLng||orderSnap.clientLng||0);
  let dist = pLat? calcKm(lat,lng,pLat,pLng).toFixed(1) : '?';
  let offer = {
    courierId: riderKey,
    name: riderName,
    phone: riderKey,
    fee: orderFee || orderSnap.fee || orderSnap.total || 40,
    lat: lat,
    lng: lng,
    distance: dist,
    createdAt: Date.now()
  };
  await fetch(DB_URL+'/orders/'+fbId+'/offers/'+riderKey+'.json',{
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(offer)
  });
  btn.innerText = '✓ تم ارسال عرضك';
  btn.style.background = '#0a9e3f';
  alert('تم ارسال عرضك للعميل بنفس سعر الطلب');
}

async function checkBal(){
  try{
    let r=await fetch(DB_URL+'/riders/'+riderKey+'/balance.json');
    let b=await r.json();
    if(b!=null) document.getElementById('bal').innerText=parseFloat(b).toFixed(2);
  }catch(e){}
}

checkBal();
loadDeliveryOrders();
startCountdown();
setInterval(loadDeliveryOrders, 7000);
</script>
</body>
  </html>

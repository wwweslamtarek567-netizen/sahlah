<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الأرباح - سهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background:#f6f6f6;min-height:100vh;padding-bottom:20px}
.header{height:85px;background:#ff7410;border-radius:0 0 28px 28px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;color:#fff;position:relative;overflow:hidden}
.header.logo-box{position:absolute;right:0;top:0;width:100%;height:100%;display:flex;align-items:center;z-index:1}
.header.logo-box img{width:100%;height:100%;object-fit:fill}
.header.title{position:relative;z-index:2;font-weight:800;font-size:18px;width:100%;text-align:center}
.back{position:relative;z-index:2;background:rgba(0,0,0,.2);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;font-size:18px}
.content{padding:14px 12px;max-width:480px;margin:auto}
.top-summary{background:#fff;border-radius:20px;padding:16px;box-shadow:0 4px 15px rgba(0,0,0,.06);display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{border-radius:16px;padding:14px;text-align:center}
.box.orange{background:#fff7e6;border:1px solid #ffe0b8}
.box.green{background:#e8f8ee;border:1px solid #b8eecb}
.box.blue{background:#eef2ff;border:1px solid #c7d4ff}
.box.purple{background:#f6efff;border:1px solid #ddd0ff}
.box.lbl{font-size:11px;color:#888;font-weight:700}
.box.num{font-size:22px;font-weight:900;margin-top:4px}
.box.sub{font-size:11px;font-weight:800;margin-top:2px;color:#666}
.card{background:#fff;border-radius:16px;margin-top:14px;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-head h3{font-size:14px;font-weight:800}
.calc{display:flex;justify-content:space-between;background:#f9f9f9;border-radius:10px;padding:10px 12px;font-size:12px;font-weight:700;margin-bottom:8px}
.order-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f2f2f2}
.order-row:last-child{border:none}
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;background:#e8f8ee;color:#0ab04a}
.empty{text-align:center;padding:20px;color:#999;font-weight:700;font-size:13px}
.btn{width:100%;height:52px;border-radius:14px;border:1.5px solid #ffe0b8;background:#fff;color:#ff7410;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;margin-top:16px}
</style>
</head>
<body>

<div class="header">
  <div class="logo-box"><img src="logo-white.png" alt="سهلة"></div>
  <a class="back" href="profile.html"><i class="fa-solid fa-chevron-right"></i></a>
  <div class="title">الأرباح</div>
  <div style="width:38px;z-index:2"></div>
</div>

<div class="content">
  <div class="top-summary">
    <div class="box orange">
      <div class="lbl">أرباح اليوم</div>
      <div class="num" id="todayProfit">0 ج</div>
      <div class="sub"><span id="todayCount">0</span> طلبات</div>
    </div>
    <div class="box green">
      <div class="lbl">أرباح الأسبوع</div>
      <div class="num" id="weekProfit">0 ج</div>
      <div class="sub"><span id="weekCount">0</span> طلبات</div>
    </div>
    <div class="box blue">
      <div class="lbl">أرباح الشهر</div>
      <div class="num" id="monthProfit">0 ج</div>
      <div class="sub"><span id="monthCount">0</span> طلبات</div>
    </div>
    <div class="box purple">
      <div class="lbl">إجمالي الأرباح</div>
      <div class="num" id="totalProfit">0 ج</div>
      <div class="sub"><span id="totalCount">0</span> طلبات</div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3><i class="fa-solid fa-calculator" style="color:#ff7410"></i> طريقة الحساب</h3><span class="badge">صافي 34 جنيه/طلب</span></div>
    <div class="calc"><span>سعر التوصيل</span><span>40 جنيه</span></div>
    <div class="calc"><span>عمولة سهلة 15%</span><span>- 6 جنيه</span></div>
    <div class="calc" style="background:#fff7e6;border:1px solid #ffe0b8"><span>صافي ربحك</span><span style="color:#ff7410;font-weight:900">34 جنيه</span></div>
  </div>

  <div class="card">
    <div class="card-head"><h3><i class="fa-solid fa-list" style="color:#0ab04a"></i> الطلبات المسلمة</h3><span style="font-size:11px;color:#999" id="lastUpdate">--</span></div>
    <div id="ordersList"><div class="empty">جاري تحميل الأرباح...</div></div>
  </div>

  <a href="profile.html" class="btn"><i class="fa-solid fa-arrow-right"></i> رجوع لحسابي</a>
</div>

<script>
const DELIVERY_FEE = 40;
const COMMISSION = 6; // 15%
const NET_PROFIT = 34;

function cleanP(p){ return String(p||'').replace(/\D/g,''); }
var riderId = localStorage.getItem('riderId') || localStorage.getItem('riderPhone') || '';
var riderKey = cleanP(riderId);

function isToday(dateStr){
  let d = new Date(dateStr);
  let now = new Date();
  return d.getDate()==now.getDate() && d.getMonth()==now.getMonth() && d.getFullYear()==now.getFullYear();
}
function isThisWeek(dateStr){
  let d = new Date(dateStr);
  let now = new Date();
  let oneWeekAgo = new Date(); oneWeekAgo.setDate(now.getDate()-7);
  return d >= oneWeekAgo;
}
function isThisMonth(dateStr){
  let d = new Date(dateStr);
  let now = new Date();
  return d.getMonth()==now.getMonth() && d.getFullYear()==now.getFullYear();
}

async function loadEarnings(){
  let allOrders = [];

  // 1- حاول من السيرفر - /orders
  try{
    if(typeof DB_URL!== 'undefined'){
      let res = await fetch(DB_URL + '/orders.json?t=' + Date.now());
      let data = await res.json();
      if(data){
        Object.keys(data).forEach(k=>{
          let o = data[k];
          // شروط المندوب ده وطلب مسلم
          if(o && (cleanP(o.riderPhone)==riderKey || cleanP(o.riderId)==riderKey) && (o.status=='delivered' || o.status=='تم التوصيل' || o.delivered==true)){
            allOrders.push({id:k,...o, date:o.deliveredAt || o.date || o.createdAt || new Date().toISOString()});
          }
        });
      }
    }
  }catch(e){ console.log(e); }

  // 2- لو مفيش من السيرفر، استخدم localStorage اللي بنحفظه لما يسلم طلب
  if(allOrders.length==0){
    let saved = JSON.parse(localStorage.getItem('earnings_' + riderKey) || '[]');
    allOrders = saved;
  }

  // لو بردو مفيش، استخدم عدد الطلبات المسلمة العام
  if(allOrders.length==0){
    let deliveredCount = parseInt(localStorage.getItem('deliveredCount') || localStorage.getItem('riderDelivered') || '0');
    if(deliveredCount>0){
      for(let i=0;i<deliveredCount;i++){
        allOrders.push({date:new Date().toISOString(), profit:NET_PROFIT});
      }
    }
  }

  calcAndRender(allOrders);
}

function calcAndRender(orders){
  let todayC=0, weekC=0, monthC=0, totalC=orders.length;
  orders.forEach(o=>{
    let d = o.date || new Date().toISOString();
    if(isToday(d)) todayC++;
    if(isThisWeek(d)) weekC++;
    if(isThisMonth(d)) monthC++;
  });

  document.getElementById('todayCount').innerText = todayC;
  document.getElementById('todayProfit').innerText = (todayC * NET_PROFIT) + ' ج';
  document.getElementById('weekCount').innerText = weekC;
  document.getElementById('weekProfit').innerText = (weekC * NET_PROFIT) + ' ج';
  document.getElementById('monthCount').innerText = monthC;
  document.getElementById('monthProfit').innerText = (monthC * NET_PROFIT) + ' ج';
  document.getElementById('totalCount').innerText = totalC;
  document.getElementById('totalProfit').innerText = (totalC * NET_PROFIT) + ' ج';
  document.getElementById('lastUpdate').innerText = new Date().toLocaleDateString('ar-EG');

  let list = document.getElementById('ordersList');
  if(orders.length==0){
    list.innerHTML = '<div class="empty">لسه مسلمتش طلبات<br>اول ما تسلم طلب هيظهر هنا بـ 34 جنيه</div>';
    return;
  }
  list.innerHTML = '';
  orders.slice().reverse().slice(0,50).forEach(o=>{
    let date = new Date(o.date).toLocaleDateString('ar-EG');
    list.innerHTML += `
      <div class="order-row">
        <div>
          <div style="font-weight:800;font-size:13px">طلب #${String(o.id||'').substring(0,6) || '---'}</div>
          <div style="font-size:11px;color:#999">${date} - ${o.address||o.clientAddress||''}</div>
        </div>
        <div style="text-align:left">
          <div style="font-weight:900;color:#0ab04a">+${NET_PROFIT} ج</div>
          <div style="font-size:10px;color:#999">40 - 6</div>
        </div>
      </div>`;
  });
}

// دي الدالة اللي تناديها لما المندوب يسلم طلب - ضيفها في صفحة الطلبات
function addProfitOnDelivery(orderId, orderData){
  let key = riderKey;
  let arr = JSON.parse(localStorage.getItem('earnings_' + key) || '[]');
  arr.push({
    id: orderId || Date.now(),
    date: new Date().toISOString(),
    address: orderData?.address || '',
    profit: NET_PROFIT
  });
  localStorage.setItem('earnings_' + key, JSON.stringify(arr));

  // تحديث في السيرفر لو موجود
  if(typeof DB_URL!== 'undefined' && key){
    fetch(DB_URL + '/riders/' + key + '/earnings.json', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({date:new Date().toISOString(), profit:NET_PROFIT, orderId:orderId})
    });
  }
}

window.onload = loadEarnings;
</script>
</body>
  </html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الأرباح - سهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background:#f6f6f6;min-height:100vh;padding-bottom:20px}
.header{height:62px;background:#ff9d0a;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:relative}
.right-side{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:16px}
.right-side img{width:38px;height:38px;border-radius:10px;background:#fff;object-fit:contain;padding:3px}
.left-side{display:flex;align-items:center;gap:14px;color:#fff;font-size:20px}
.back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;font-size:16px}
.content{padding:14px 12px;max-width:480px;margin:auto}
.top-summary{background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 15px rgba(0,0,0,.06);display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{border-radius:16px;padding:14px;text-align:center;border:1px solid #eee;transition:0.2s}
.box.orange{background:#fff8e6;border-color:#ffedc2}
.box.green{background:#e8f8ee;border-color:#c8ebce}
.box.blue{background:#eef2ff;border-color:#d7ddff}
.box.purple{background:#f6efff;border-color:#e2d4ff}
.box.lbl{font-size:13px;color:#333;font-weight:800}
.box.num{font-size:18px;font-weight:900;margin-top:6px}
.box.sub{font-size:12px;font-weight:700;margin-top:4px;color:#666}
.card{background:#fff;border-radius:16px;margin-top:14px;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-head h3{font-size:13px;font-weight:800}
.order-row{display:flex;justify-content:space-between;align-items:center;padding:12px 8px;border-bottom:1px solid #f2f2f2;border-radius:12px;transition:0.2s;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.order-row:last-child{border:none}
.order-row.pressing{background:#ffeaea;transform:scale(0.98)}
.order-row:active{background:#fff3e0}
.empty{text-align:center;padding:24px;color:#999;font-weight:700;font-size:13px;line-height:22px}
.btn{width:100%;height:50px;border-radius:14px;border:1.5px solid #ffe0b8;background:#fff;color:#ff7410;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;margin-top:16px}
.delete-hint{text-align:center;font-size:11px;color:#999;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:999;padding:15px}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:320px;text-align:center}
</style>
</head>
<body>

<div class="header">
  <div class="left-side">
    <a class="back" href="profile.html"><i class="fa-solid fa-chevron-right"></i></a>
    <i class="fa-solid fa-bell"></i>
    <i class="fa-solid fa-share-nodes"></i>
  </div>
  <div class="right-side">
    <span>سهلة</span>
    <img src="logo-white.png" alt="سهلة">
  </div>
</div>

<div class="content">
  <div class="top-summary">
    <div class="box orange">
      <div class="lbl">أرباح اليوم</div>
      <div class="num" id="todayProfit">0 ج</div>
      <div class="sub"><span id="todayCount">0</span> طلبات</div>
    </div>
    <div class="box green">
      <div class="lbl">أرباح الأسبوع</div>
      <div class="num" id="weekProfit">0 ج</div>
      <div class="sub"><span id="weekCount">0</span> طلبات</div>
    </div>
    <div class="box blue">
      <div class="lbl">أرباح الشهر</div>
      <div class="num" id="monthProfit">0 ج</div>
      <div class="sub"><span id="monthCount">0</span> طلبات</div>
    </div>
    <div class="box purple">
      <div class="lbl">إجمالي الأرباح</div>
      <div class="num" id="totalProfit">0 ج</div>
      <div class="sub"><span id="totalCount">0</span> طلبات</div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3><i class="fa-solid fa-list" style="color:#0ab04a"></i> الطلبات المسلمة</h3><span style="font-size:11px;color:#999" id="lastUpdate">--</span></div>
    <div id="ordersList"><div class="empty">جاري التحميل...</div></div>
    <div class="delete-hint"><i class="fa-solid fa-hand-pointer"></i> دوسة طويلة على الطلب عشان تمسحه</div>
  </div>

  <a href="profile.html" class="btn"><i class="fa-solid fa-arrow-right"></i> رجوع لحسابي</a>
</div>

<!-- مودال تأكيد المسح -->
<div class="modal" id="deleteModal">
  <div class="modal-box">
    <i class="fa-solid fa-trash" style="font-size:28px;color:#ff3b30"></i>
    <h3 style="margin:10px 0">تمسح الطلب ده؟</h3>
    <p id="deleteInfo" style="font-size:13px;color:#666;font-weight:700"></p>
    <div style="display:flex;gap:10px;margin-top:15px">
      <button onclick="closeDelete()" style="flex:1;padding:12px;border-radius:12px;border:1.5px solid #eee;background:#fff;font-family:'Cairo';font-weight:800">إلغاء</button>
      <button onclick="confirmDelete()" style="flex:1;padding:12px;border-radius:12px;border:none;background:#ff3b30;color:#fff;font-family:'Cairo';font-weight:800">امسح</button>
    </div>
  </div>
</div>

<script>
function cleanP(p){ return String(p||'').replace(/\D/g,'').replace(/^0+/,''); }

let allEarnings = [];
let riderKeyLocal = null;
let fbEarningsMap = {}; // { firebaseKey : data }
let pendingDeleteIndex = -1;
let pressTimer = null;

async function loadEarnings(){
  let riderId = localStorage.getItem('riderId') || localStorage.getItem('riderPhone') || '';
  if(!riderId){
    document.getElementById('ordersList').innerHTML='<div class="empty">سجل دخول الأول</div>';
    return;
  }
  let cleanKey = cleanP(riderId);

  let localAll = [];
  try{
    localAll = JSON.parse(localStorage.getItem('earnings_' + cleanKey) || '[]');
    if(localAll.length==0){
      let old = JSON.parse(localStorage.getItem('earnings_' + riderId) || '[]');
      if(old.length>0) localAll = old;
    }
  }catch(e){ localAll=[]; }

  // قراية من السيرفر
  try{
    if(typeof DB_URL!== 'undefined'){
      let rRes = await fetch(DB_URL + '/riders.json?t='+Date.now());
      let rData = await rRes.json();
      if(rData){
        let list = Object.entries(rData).map(([k,v])=>({...v,_key:k}));
        let me = list.find(r=> cleanP(r.phone)==cleanKey || r.id==riderId || r.phone==riderId);
        if(me){
          riderKeyLocal = me._key;
          let eRes = await fetch(DB_URL + '/riders/' + riderKeyLocal + '/earnings.json?t='+Date.now());
          let eData = await eRes.json();
          if(eData){
            fbEarningsMap = eData;
            Object.entries(eData).forEach(([fbKey,o])=>{
              if(!localAll.some(x=> x.date==o.date && String(x.fee)==String(o.fee) && String(x.id)==String(o.id))){
                localAll.push({...o, _fbKey:fbKey});
              } else {
                // اربط الـ fbKey باللي موجود محلي
                let idx = localAll.findIndex(x=> x.date==o.date && String(x.fee)==String(o.fee));
                if(idx>-1 &&!localAll[idx]._fbKey) localAll[idx]._fbKey = fbKey;
              }
            });
          }
        }
      }
    }
  }catch(e){ console.log(e); }

  allEarnings = localAll;
  render();
}

function render(){
  function isToday(s){ let d=new Date(s), n=new Date(); return d.toDateString()==n.toDateString(); }
  function isThisWeek(s){ let d=new Date(s), n=new Date(), w=new Date(); w.setDate(n.getDate()-7); return d>=w; }
  function isThisMonth(s){ let d=new Date(s), n=new Date(); return d.getMonth()==n.getMonth() && d.getFullYear()==n.getFullYear(); }

  let tP=0,wP=0,mP=0,totalP=0, tC=0,wC=0,mC=0;
  allEarnings.forEach(o=>{
    let fee = parseFloat(o.fee || 0);
    let net = parseFloat(o.net || (fee*0.85) || 0);
    let d = o.date || new Date().toISOString();
    totalP+=net;
    if(isToday(d)){ tP+=net; tC++; }
    if(isThisWeek(d)){ wP+=net; wC++; }
    if(isThisMonth(d)){ mP+=net; mC++; }
  });

  document.getElementById('todayCount').innerText=tC;
  document.getElementById('todayProfit').innerText= tP.toFixed(2)+' ج';
  document.getElementById('weekCount').innerText=wC;
  document.getElementById('weekProfit').innerText= wP.toFixed(2)+' ج';
  document.getElementById('monthCount').innerText=mC;
  document.getElementById('monthProfit').innerText= mP.toFixed(2)+' ج';
  document.getElementById('totalCount').innerText=allEarnings.length;
  document.getElementById('totalProfit').innerText= totalP.toFixed(2)+' ج';
  document.getElementById('lastUpdate').innerText=new Date().toLocaleDateString('ar-EG');

  let listEl=document.getElementById('ordersList');
  if(allEarnings.length==0){
    listEl.innerHTML='<div class="empty">لسه مسلمتش طلبات</div>';
    return;
  }
  listEl.innerHTML='';
  allEarnings.slice().reverse().forEach((o, revIndex)=>{
    let realIndex = allEarnings.length-1-revIndex;
    let date=new Date(o.date).toLocaleDateString('ar-EG');
    let time=new Date(o.date).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
    let fee = o.fee || 0;
    let net = parseFloat(o.net || fee*0.85).toFixed(2);
    listEl.innerHTML+=`
      <div class="order-row" data-index="${realIndex}"
        ontouchstart="startPress(${realIndex}, this)" ontouchend="endPress()" ontouchmove="endPress()"
        onmousedown="startPress(${realIndex}, this)" onmouseup="endPress()" onmouseleave="endPress()">
        <div>
          <div style="font-weight:800;font-size:13px">توصيل ${fee} ج <span style="font-size:10px;color:#999">(${time})</span></div>
          <div style="font-size:11px;color:#999">${date}</div>
        </div>
        <div style="text-align:left">
          <div style="font-weight:900;color:#0ab04a">+${net} ج</div>
          <div style="font-size:11px;color:#999">صافي 85%</div>
        </div>
      </div>`;
  });
}

function startPress(index, el){
  el.classList.add('pressing');
  pressTimer = setTimeout(()=>{
    el.classList.remove('pressing');
    openDelete(index);
    if(navigator.vibrate) navigator.vibrate(80);
  }, 750); // دوسة طويلة
}
function endPress(){
  clearTimeout(pressTimer);
  document.querySelectorAll('.order-row.pressing').forEach(e=>e.classList.remove('pressing'));
}

function openDelete(index){
  pendingDeleteIndex = index;
  let o = allEarnings[index];
  document.getElementById('deleteInfo').innerText = `توصيل ${o.fee}ج - صافي ${parseFloat(o.net||o.fee*0.85).toFixed(2)}ج\n${new Date(o.date).toLocaleString('ar-EG')}`;
  document.getElementById('deleteModal').classList.add('show');
}
function closeDelete(){
  document.getElementById('deleteModal').classList.remove('show');
  pendingDeleteIndex=-1;
}

async function confirmDelete(){
  if(pendingDeleteIndex<0) return;
  let toDelete = allEarnings[pendingDeleteIndex];

  // 1- امسح من الليست المحلية
  allEarnings.splice(pendingDeleteIndex,1);

  // 2- احفظ في localStorage
  let riderId = localStorage.getItem('riderId') || localStorage.getItem('riderPhone') || '';
  let cleanKey = cleanP(riderId);
  localStorage.setItem('earnings_' + cleanKey, JSON.stringify(allEarnings));
  localStorage.setItem('earnings_' + riderId, JSON.stringify(allEarnings));

  // 3- امسح من Firebase لو موجود
  if(riderKeyLocal && toDelete){
    try{
      let fbKey = toDelete._fbKey || null;
      // لو مش معانا المفتاح دور عليه
      if(!fbKey){
        for(let k in fbEarningsMap){
          let v = fbEarningsMap[k];
          if(v.date==toDelete.date && String(v.fee)==String(toDelete.fee)){
            fbKey=k; break;
          }
        }
      }
      if(fbKey){
        await fetch(DB_URL + '/riders/' + riderKeyLocal + '/earnings/' + fbKey + '.json', {method:'DELETE'});
        delete fbEarningsMap[fbKey];
      }
    }catch(e){ console.log('firebase delete err',e); }
  }

  closeDelete();
  render();
}

window.onload=loadEarnings;
</script>
</body>
  </html>

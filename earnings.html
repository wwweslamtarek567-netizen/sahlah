<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الأرباح - سهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background:#f6f6f6;min-height:100vh;padding-bottom:20px}
.header{height:62px;background:#ff9d0a;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:relative}
.right-side{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:16px}
.right-side img{width:38px;height:38px;border-radius:10px;background:#fff;object-fit:contain;padding:3px}
.left-side{display:flex;align-items:center;gap:14px;color:#fff;font-size:20px}
.back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;font-size:16px}
.content{padding:14px 12px;max-width:480px;margin:auto}
.top-summary{background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 15px rgba(0,0,0,.06);display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{border-radius:16px;padding:14px;text-align:center;border:1px solid #eee}
.box.orange{background:#fff8e6;border-color:#ffedc2}
.box.green{background:#e8f8ee;border-color:#c8ebce}
.box.blue{background:#eef2ff;border-color:#d7ddff}
.box.purple{background:#f6efff;border-color:#e2d4ff}
.box.lbl{font-size:13px;color:#333;font-weight:800}
.box.num{font-size:18px;font-weight:900;margin-top:6px}
.box.sub{font-size:12px;font-weight:700;margin-top:4px;color:#666}
.card{background:#fff;border-radius:16px;margin-top:14px;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-head h3{font-size:13px;font-weight:800}
.order-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f2f2f2}
.order-row:last-child{border:none}
.empty{text-align:center;padding:24px;color:#999;font-weight:700;font-size:13px;line-height:22px}
.btn{width:100%;height:50px;border-radius:14px;border:1.5px solid #ffe0b8;background:#fff;color:#ff7410;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;margin-top:16px}
</style>
</head>
<body>

<div class="header">
  <div class="left-side">
    <a class="back" href="profile.html"><i class="fa-solid fa-chevron-right"></i></a>
    <i class="fa-solid fa-bell"></i>
    <i class="fa-solid fa-share-nodes"></i>
  </div>
  <div class="right-side">
    <span>سهلة</span>
    <img src="logo-white.png" alt="سهلة">
  </div>
</div>

<div class="content">
  <div class="top-summary">
    <div class="box orange">
      <div class="lbl">أرباح اليوم</div>
      <div class="num" id="todayProfit">0 ج</div>
      <div class="sub"><span id="todayCount">0</span> طلبات</div>
    </div>
    <div class="box green">
      <div class="lbl">أرباح الأسبوع</div>
      <div class="num" id="weekProfit">0 ج</div>
      <div class="sub"><span id="weekCount">0</span> طلبات</div>
    </div>
    <div class="box blue">
      <div class="lbl">أرباح الشهر</div>
      <div class="num" id="monthProfit">0 ج</div>
      <div class="sub"><span id="monthCount">0</span> طلبات</div>
    </div>
    <div class="box purple">
      <div class="lbl">إجمالي الأرباح</div>
      <div class="num" id="totalProfit">0 ج</div>
      <div class="sub"><span id="totalCount">0</span> طلبات</div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3><i class="fa-solid fa-list" style="color:#0ab04a"></i> الطلبات المسلمة</h3><span style="font-size:11px;color:#999" id="lastUpdate">--</span></div>
    <div id="ordersList"><div class="empty">جاري التحميل...</div></div>
  </div>

  <a href="profile.html" class="btn"><i class="fa-solid fa-arrow-right"></i> رجوع لحسابي</a>
</div>

<script>
const COMMISSION_RATE = 0.15; // 15% بتوع سهلة
function cleanP(p){ return String(p||'').replace(/\D/g,''); }
var riderId = localStorage.getItem('riderId') || localStorage.getItem('riderPhone') || '';
var riderKey = cleanP(riderId);

function getFee(order){
  // بيحاول يقرا سعر التوصيل بأي اسم انت مستخدمه
  return parseFloat(order.deliveryFee || order.fee || order.price || order.deliveryPrice || order.amount || 40);
}
function getNet(fee){ return fee - (fee * COMMISSION_RATE); }

function isToday(s){let d=new Date(s),n=new Date();return d.getDate()==n.getDate()&&d.getMonth()==n.getMonth()&&d.getFullYear()==n.getFullYear()}
function isThisWeek(s){let d=new Date(s),n=new Date(),w=new Date();w.setDate(n.getDate()-7);return d>=w}
function isThisMonth(s){let d=new Date(s),n=new Date();return d.getMonth()==n.getMonth()&&d.getFullYear()==n.getFullYear()}

async function loadEarnings(){
  let all=[];
  try{
    if(typeof DB_URL!=='undefined'){
      let res=await fetch(DB_URL+'/orders.json?t='+Date.now());
      let data=await res.json();
      if(data){
        Object.keys(data).forEach(k=>{
          let o=data[k];
          if(o && (cleanP(o.riderPhone)==riderKey||cleanP(o.riderId)==riderKey) && (o.status=='delivered'||o.status=='تم التوصيل'||o.delivered==true)){
            let fee = getFee(o);
            all.push({id:k,...o, fee:fee, net:getNet(fee), date:o.deliveredAt||o.date||o.createdAt||new Date().toISOString()});
          }
        });
      }
    }
  }catch(e){}
  if(all.length==0){
    let saved=JSON.parse(localStorage.getItem('earnings_'+riderKey)||'[]');
    all=saved.map(o=>{ let fee=getFee(o); return {...o, fee:fee, net:o.net||getNet(fee)} });
  }

  // حساب المجاميع
  let tP=0,wP=0,mP=0,totalP=0, tC=0,wC=0,mC=0;
  all.forEach(o=>{
    let d=o.date||new Date().toISOString();
    let net=o.net||getNet(getFee(o));
    totalP+=net;
    if(isToday(d)){ tP+=net; tC++; }
    if(isThisWeek(d)){ wP+=net; wC++; }
    if(isThisMonth(d)){ mP+=net; mC++; }
  });

  document.getElementById('todayCount').innerText=tC;
  document.getElementById('todayProfit').innerText= tP.toFixed(2)+' ج';
  document.getElementById('weekCount').innerText=wC;
  document.getElementById('weekProfit').innerText= wP.toFixed(2)+' ج';
  document.getElementById('monthCount').innerText=mC;
  document.getElementById('monthProfit').innerText= mP.toFixed(2)+' ج';
  document.getElementById('totalCount').innerText=all.length;
  document.getElementById('totalProfit').innerText= totalP.toFixed(2)+' ج';
  document.getElementById('lastUpdate').innerText=new Date().toLocaleDateString('ar-EG');

  let list=document.getElementById('ordersList');
  if(all.length==0){list.innerHTML='<div class="empty">لسه مسلمتش طلبات<br>اول ما تسلم طلب هيظهر هنا</div>';return;}
  list.innerHTML='';
  all.slice().reverse().slice(0,100).forEach(o=>{
    let date=new Date(o.date).toLocaleDateString('ar-EG');
    list.innerHTML+=`<div class="order-row"><div><div style="font-weight:800;font-size:13px">طلب #${String(o.id||'').substring(0,6)||'--'}</div><div style="font-size:11px;color:#999">${date} - التوصيل ${o.fee}ج</div></div><div style="text-align:left"><div style="font-weight:900;color:#0ab04a">+${o.net.toFixed(2)} ج</div></div></div>`;
  });
}

function addProfitOnDelivery(orderId, orderData){
  let fee = getFee(orderData||{});
  let net = getNet(fee);
  let arr=JSON.parse(localStorage.getItem('earnings_'+riderKey)||'[]');
  arr.push({id:orderId||Date.now(),date:new Date().toISOString(),fee:fee,net:net,address:orderData?.address||''});
  localStorage.setItem('earnings_'+riderKey,JSON.stringify(arr));
}

window.onload=loadEarnings;
</script>
</body>
  </html>

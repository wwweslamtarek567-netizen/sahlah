  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',Arial,sans-serif;}
    body{background:#f5f5f5;color:#222;min-height:100vh;}
    .app{width:100%;max-width:480px;min-height:100vh;margin:auto;background:#f5f5f5;padding-bottom:80px;}
    .header{height:70px;background:#ff7410;border-radius:0 0 22px 22px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;color:#fff;font-weight:800;font-size:16px;}
    .back{color:#fff;text-decoration:none;font-size:22px;background:rgba(0,0,0,.15);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
    .content{padding:16px 12px;}
    .card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 15px rgba(0,0,0,.06);text-align:center;}
    .icon-big{width:80px;height:80px;background:#fff0dc;color:#ed7310;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 15px;}
    .card h2{font-size:18px;font-weight:800;margin-bottom:8px;}
    .card p{font-size:13px;color:#777;line-height:1.7;margin-bottom:18px;}
    .btn-wa{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;background:#25D366;color:#fff;border-radius:14px;text-decoration:none;font-weight:800;font-size:15px;box-shadow:0 4px 12px rgba(37,211,102,.3);}
    .btn-call{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;background:#fff0dd;color:#ed6f0a;border-radius:14px;text-decoration:none;font-weight:800;font-size:15px;margin-top:10px;border:1px solid #ffe0b8;}
    .note{margin-top:14px;background:#fff8ef;border-radius:12px;padding:12px;font-size:12px;color:#b46a17;font-weight:700;text-align:right;line-height:1.6;}
  </style>
</head>
<body>
<div class="app">

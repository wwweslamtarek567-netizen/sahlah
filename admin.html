<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم - سهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',sans-serif;background:#f8f8f8;padding-bottom:90px}
.header{background:#ff6a00;color:white;padding:15px 20px 25px 20px;border-bottom-left-radius:25px;border-bottom-right-radius:25px;display:flex;justify-content:space-between;align-items:center}
.header .logo{font-size:32px;font-weight:800;line-height:1}
.header .logo span{display:block;font-size:16px;font-weight:400}
.badge{position:absolute;top:-5px;right:-5px;background:red;color:white;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:15px}
.c{border-radius:18px;padding:15px;text-align:center}
.c i{font-size:32px;margin-bottom:8px;display:block}
.c .num{font-size:24px;font-weight:800}
.c .lbl{font-size:13px;font-weight:700;color:#555}
.c-green{background:#e8f5e9}.c-blue{background:#e3f2fd}.c-orange{background:#fff3e0}.c-purple{background:#f3e5f5}

.list-box{background:white;margin:0 10px;border-radius:20px;padding:15px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.search{width:100%;padding:12px 15px;border-radius:30px;border:1.5px solid #ddd;font-family:'Cairo';outline:none;margin:10px 0 15px 0}
.rider-row{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid #f0f0f0;border-radius:15px;margin-bottom:10px;background:white;cursor:pointer}
.rider-row .right{display:flex;align-items:center;gap:10px}
.rider-row img{width:45px;height:45px;border-radius:50%}
.status{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px}
.s-ok{background:#e8f5e9;color:#1b5e20}.s-road{background:#fff3e0;color:#e65100}.s-off{background:#ffebee;color:#b71c1c}.s-block{background:#000;color:white}
.dot{width:8px;height:8px;border-radius:50%}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:10px 0;z-index:100}
.bottom-nav div{text-align:center;color:#888;font-size:12px;cursor:pointer}
.bottom-nav div.active{color:#ff6a00;font-weight:800}
.bottom-nav i{font-size:22px;display:block;margin-bottom:3px}
</style>
</head>
<body>

<div class="header">
  <div style="position:relative"><i class="fa-solid fa-bell" style="font-size:26px"></i><div class="badge">3</div></div>
  <div class="logo" style="text-align:center">سهلة <span>للتوصيل</span><div style="background:#a13c00;border-radius:20px;padding:4px 20px;margin-top:8px;font-size:14px">لوحة التحكم</div></div>
  <div style="display:flex;align-items:center;gap:8px"><div style="text-align:left;line-height:1.1"><b>مدير</b><br><small>سهلة</small></div><img src="https://ui-avatars.com/api/?name=Admin&background=fff&color=ff6a00" style="width:45px;height:45px;border-radius:50%"></div>
</div>

<div class="cards">
  <div class="c c-green"><i class="fa-solid fa-coins" style="color:#00a651"></i><div class="num" id="totalBalance">0</div><div class="lbl">جنيه<br>إجمالي الأرصدة<br><small>(كل المندوبين)</small></div></div>
  <div class="c c-blue"><i class="fa-solid fa-clipboard-check" style="color:#007aff"></i><div class="num" id="totalOrders">0</div><div class="lbl">طلب<br>إجمالي الطلبات<br><small>(تم تسليمها)</small></div></div>
  <div class="c c-orange"><i class="fa-solid fa-user" style="color:#ff6a00"></i><div class="num" id="totalRiders">0</div><div class="lbl">مندوب<br>إجمالي المندوبين<br>النشطين</div></div>
  <div class="c c-purple"><i class="fa-solid fa-wallet" style="color:#9c27b0"></i><div class="num" id="todayProfit">0</div><div class="lbl">جنيه<br>إجمالي أرباح اليوم<br><small>(تقريبا)</small></div></div>
</div>

<div class="list-box">
  <h3 style="margin:0;display:flex;align-items:center;gap:8px"><i class="fa-solid fa-users" style="color:#ff6a00"></i> قائمة المندوبين</h3>
  <input id="search" class="search" placeholder="ابحث باسم المندوب أو رقم الهاتف ... 🔍" onkeyup="renderRiders()">
  <div id="ridersList"></div>
</div>

<div class="bottom-nav">
  <div onclick="openSettings()"><i class="fa-solid fa-gear"></i> الإعدادات</div>
  <div><i class="fa-solid fa-clipboard"></i> الطلبات</div>
  <div><i class="fa-solid fa-users"></i> المندوبين</div>
  <div class="active"><i class="fa-solid fa-house"></i> الرئيسية</div>
</div>

<script>
function getAllRiders(){
  let riders = [];
  for(let i=0;i<localStorage.length;i++){
    let k = localStorage.key(i);
    if(k.startsWith('balance_')){
      let phone = k.replace('balance_','');
      let bal = parseFloat(localStorage.getItem(k)||0);
      let hist = JSON.parse(localStorage.getItem('history_'+phone)||'[]');
      let delivered = hist.filter(h=>h.type==='minus').length;
      let status = localStorage.getItem('status_'+phone) || 'متاح';
      let name = localStorage.getItem('name_'+phone) || 'مندوب ' + phone.slice(-4);
      riders.push({phone, bal, delivered, status, name});
    }
  }
  if(riders.length===0){
    riders = [
      {phone:'01012345678',bal:1250,delivered:48,status:'متاح',name:'أحمد محمد'},
      {phone:'01023456789',bal:980,delivered:32,status:'متاح',name:'محمد السيد'},
      {phone:'01034567890',bal:760,delivered:27,status:'متاح',name:'علي حسن'},
      {phone:'01045678901',bal:540,delivered:19,status:'في الطريق',name:'كريم أحمد'},
      {phone:'01056789012',bal:430,delivered:15,status:'متاح',name:'محمود عبد الله'},
      {phone:'01067890123',bal:320,delivered:12,status:'غير متاح',name:'إسلام حمدي'},
    ];
  }
  return riders;
}

function renderRiders(){
  let q = document.getElementById('search').value.toLowerCase();
  let riders = getAllRiders().filter(r=> r.name.includes(q) || r.phone.includes(q));
  let totalBal=0, totalOrders=0;
  riders.forEach(r=>{totalBal+=r.bal; totalOrders+=r.delivered});

  document.getElementById('totalBalance').innerText = totalBal.toLocaleString();
  document.getElementById('totalOrders').innerText = totalOrders;
  document.getElementById('totalRiders').innerText = riders.length;
  document.getElementById('todayProfit').innerText = (totalOrders * 6).toLocaleString();

  document.getElementById('ridersList').innerHTML = riders.map(r=>{
    let cls = r.status==='متاح'?'s-ok':r.status==='في الطريق'?'s-road':r.status==='محظور'?'s-block':'s-off';
    let dotColor = r.status==='متاح'?'#1b5e20':r.status==='في الطريق'?'#e65100':r.status==='محظور'?'#fff':'#b71c1c';
    return `
    <div class="rider-row" onclick="openRider('${r.phone}')">
      <div style="display:flex;align-items:center;gap:15px">
        <span><i class="fa-solid fa-chevron-left"></i></span>
        <div class="status ${cls}"><span class="dot" style="background:${dotColor}"></span>${r.status}</div>
        <div style="text-align:center"><b>${r.delivered}</b><br><small>طلب</small></div>
        <div style="text-align:center"><b>${r.bal.toLocaleString()}</b><br><small>جنيه</small></div>
      </div>
      <div class="right">
        <div style="text-align:left"><div>${r.phone}</div><b>${r.name}</b></div>
        <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(r.name)}&background=ff6a00&color=fff">
      </div>
    </div>`;
  }).join('');
}

// ده التعديل المهم
function openRider(phone){
  window.location.href = 'rider-details.html?phone=' + phone;
}

function openSettings(){
  let curr = localStorage.getItem('commission_percent')||15;
  let n = prompt('نسبة العمولة الحالية %', curr);
  if(n){ localStorage.setItem('commission_percent', n); alert('تم حفظ نسبة العمولة '+n+'% - سيتم تطبيقها في order-details.html تلقائيا'); }
}

renderRiders();
</script>
</body>
  </html>

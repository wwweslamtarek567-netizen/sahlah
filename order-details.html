<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>سهلة للتوصيل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#f2f2f2}

/* الهيدر */
.header{background:#ff6600;color:white;padding:12px 16px;border-radius:0 0 30px 30px;display:flex;justify-content:space-between;align-items:center}
.header.center{text-align:center;font-size:26px;font-weight:800}
.header.center span{font-size:15px;font-weight:400;display:block}
.header i{font-size:24px}

/* الخريطة */
.map{position:relative;height:46vh;background:#b8e0ff;overflow:hidden}
.badge{position:absolute;top:15px;padding:10px 14px;border-radius:15px;color:white;font-weight:800;font-size:15px;text-align:center;line-height:1.6}
.badge::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border-left:8px solid transparent;border-right:8px solid transparent}
.badge-green{left:15px;background:#00a651}
.badge-green::after{border-top:8px solid #00a651}
.badge-blue{right:15px;background:#0066ff}
.badge-blue::after{border-top:8px solid #0066ff}
.route{position:absolute;bottom:42%;left:10%;width:80%;height:6px;background:#00a651;border-radius:10px;transform:rotate(-15deg)}
.route-tag{position:absolute;bottom:40%;left:48%;background:white;border:2px solid #333;border-radius:6px;padding:2px 8px;font-weight:800;font-size:13px}
.point-b{position:absolute;bottom:39%;left:10%;width:42px;height:42px;background:#00a651;border-radius:50%;color:white;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;border:3px solid white}
.point-a{position:absolute;bottom:39%;right:12%;width:50px;height:50px;background:white;border-radius:50%;border:5px solid #ff6600;display:flex;align-items:center;justify-content:center}
.point-a i{color:#333;font-size:26px}
.btn-round{position:absolute;width:48px;height:48px;border-radius:50%;background:white;border:none;font-size:24px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
.zoom-plus{left:15px;bottom:70px}
.zoom-minus{left:15px;bottom:15px}
.loc-btn{right:15px;bottom:40px}

/* الكارت */
.card{background:white;margin:-25px 12px 15px 12px;border-radius:20px;padding:16px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.tag{background:#ff6600;color:white;padding:9px 14px;border-radius:20px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
.tag i{font-size:18px}
.price{text-align:left}
.price.km{font-size:14px;color:#666;display:flex;align-items:center;gap:5px;justify-content:flex-end}
.price.amount{font-size:30px;font-weight:800;margin-top:2px}

.info{display:flex;gap:12px;border-bottom:1px dashed #ddd;padding:15px 0;margin:15px 0}
.info-main{flex:1}
.info-main h3{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.info-main h3 i{background:#ff6600;color:white;padding:5px;border-radius:50%;font-size:12px}
.info-main p{font-size:13px;color:#444;line-height:1.7}
.client{border-right:1px solid #eee;padding-right:12px;text-align:center;min-width:75px}
.avatar{width:60px;height:60px;border-radius:50%;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:30px}
.client-name{font-weight:800;font-size:14px;margin-top:4px}
.client-rate{font-weight:800;font-size:14px}
.client-rate i{color:#ffc107;font-size:12px}

/* الزراير */
.step{display:none}
.btn{width:100%;padding:15px;border:none;border-radius:14px;font-family:'Cairo';font-size:17px;font-weight:800;display:flex;justify-content:center;align-items:center;gap:8px;margin:10px 0;color:white}
.btn i{font-size:20px}
.btn-orange{background:#ff6600}
.btn-green{background:#00a651;justify-content:space-between;padding:15px 18px}
.btn-green.check{width:32px;height:32px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center}
.btn-green.check i{color:#00a651}
.btn-blue{background:#0066ff;justify-content:space-between;padding:15px 18px}
.btn-blue.box{width:32px;height:32px;background:white;border-radius:8px;display:flex;align-items:center;justify-content:center}
.btn-blue.box i{color:#0066ff}
.suggest{text-align:center;color:#666;font-weight:700;margin:8px 0;font-size:15px}
</style>
</head>
<body>

<div class="header">
  <i class="fa-solid fa-arrow-right"></i>
  <div class="center">سهلة <i class="fa-solid fa-motorcycle"></i><span>للتوصيل</span></div>
  <i class="fa-solid fa-bars"></i>
</div>

<div class="map">
  <div class="badge badge-green">15 دقيقة<br>11,6 كم</div>
  <div class="badge badge-blue">4 دقيقة<br>1,0 كم</div>
  <div class="route"></div>
  <div class="route-tag">40</div>
  <div class="point-b">B</div>
  <div class="point-a"><i class="fa-solid fa-motorcycle"></i></div>
  <button class="btn-round zoom-plus">+</button>
  <button class="btn-round zoom-minus">-</button>
  <button class="btn-round loc-btn"><i class="fa-solid fa-location-crosshairs"></i></button>
</div>

<div class="card">
  <div class="top">
    <div class="tag"><i class="fa-solid fa-motorcycle"></i> طلب توصيل</div>
    <div class="price">
      <div class="km"><i class="fa-regular fa-clock" style="color:#ff6600"></i> 1,0 كم</div>
      <div class="amount"><span id="orderPrice">40</span> جنيه</div>
    </div>
  </div>

  <div class="info">
    <div class="info-main">
      <h3>مطعم الشيف حسن <i class="fa-solid fa-utensils"></i></h3>
      <p>,CJG+RV). المنصورة الجديدة<br>المنصورة الجديدة، محافظة الدقهلية<br>(الساموني)</p>
    </div>
    <div class="client">
      <div class="avatar">😊</div>
      <div class="client-name">العميل</div>
      <div class="client-rate">4.93 <i class="fa-solid fa-star"></i></div>
      <small style="font-size:12px;color:#777">(24)<br>الآن</small>
    </div>
  </div>

  <!-- الزراير ال 4 -->
  <div class="step" id="step1" style="display:block">
    <button class="btn btn-orange" onclick="goStep(2)"><i class="fa-solid fa-motorcycle"></i> القبول مقابل <span id="btnPrice">40</span> جنيه</button>
    <div class="suggest">اقترح أجرك</div>
  </div>

  <div class="step" id="step2">
    <button class="btn btn-green" onclick="goStep(3)"><i class="fa-solid fa-motorcycle"></i> استلمت الطلب <span class="check"><i class="fa-solid fa-check"></i></span></button>
  </div>

  <div class="step" id="step3">
    <button class="btn btn-orange" onclick="goStep(4)"><i class="fa-solid fa-location-arrow"></i> الاتجاه الى العميل</button>
  </div>

  <div class="step" id="step4">
    <button class="btn btn-blue" onclick="finish()"><i class="fa-solid fa-box"></i> تم تسليم الطلب <span class="box"><i class="fa-solid fa-check"></i></span></button>
  </div>

</div>

<script>
// غير السعر من هنا
var orderAmount = 40;
var commissionRate = 0.15; // 15%

document.getElementById('btnPrice').innerText = orderAmount;
document.getElementById('orderPrice').innerText = orderAmount;

function goStep(n){
  for(let i=1;i<=4;i++){ document.getElementById('step'+i).style.display='none'; }
  document.getElementById('step'+n).style.display='block';
}

function finish(){
  function gC(n){let d=document.cookie.split(';');for(let i=0;i<d.length;i++){let c=d[i];while(c.charAt(0)==' ')c=c.substring(1);if(c.indexOf(n+'=')==0)return c.substring(n.length+1,c.length)}return 50}
  function sC(n,v){document.cookie=n+"="+v+";path=/;max-age=31536000"}
  var balance=parseFloat(gC("balance"));
  var commission = orderAmount * commissionRate; // 15%
  balance = balance - commission; 
  if(balance<0) balance=0; 
  sC("balance",balance);
  alert("تم تسليم الطلب ✓\nسعر الاوردر: "+orderAmount+" جنيه\nالعمولة 15%: "+commission.toFixed(2)+" جنيه\nرصيدك الحالي: "+balance.toFixed(2)+" جنيه");
  location.href='home.html';
}
</script>
</body>
  </html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل الطلب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{margin:0;font-family:'Cairo',sans-serif;background:#f7f7f7;}
.header{background:#ff6a00;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center;border-bottom-left-radius:25px;border-bottom-right-radius:25px;}
.header i{font-size:20px;cursor:pointer;}
.header .logo{text-align:center;font-size:22px;font-weight:800;}
.header .logo span{font-size:13px;font-weight:400;display:block;}

#map{height:35vh;width:100%;}
.map-badge{position:absolute;z-index:1000;padding:8px 12px;border-radius:15px;font-weight:700;font-size:13px;color:white;}
.badge-a{top:20px;right:20px;background:#007bff;}
.badge-b{top:20px;left:20px;background:#28a745;}

.card{background:white;margin:-20px 15px 15px 15px;padding:15px;border-radius:20px;box-shadow:0 4px 15px rgba(0,0,0,0.1);position:relative;z-index:1001;}
.tag{background:#ff6a00;color:white;padding:8px 15px;border-radius:25px;display:inline-flex;align-items:center;gap:8px;font-weight:700;}
.price{float:left;text-align:center;}
.price .km{font-size:13px;color:#666;}
.price .amount{font-size:28px;font-weight:800;}

.info{display:flex;gap:15px;margin:15px 0;}
.info-main{flex:1;}
.info-main h3{margin:5px 0;font-size:18px;}
.info-main p{margin:5px 0;color:#666;font-size:14px;}
.client{text-align:center;border-right:1px solid #eee;padding-right:15px;}
.client img{width:60px;height:60px;border-radius:50%;background:#ddd;}
.client .rate{color:#ffc107;}

.btn-main{background:#ff6a00;color:white;width:100%;padding:15px;border:none;border-radius:15px;font-family:'Cairo';font-size:18px;font-weight:800;display:flex;justify-content:center;align-items:center;gap:10px;margin:15px 0;cursor:pointer;}
.btn-main i{font-size:22px;}

.suggest{text-align:center;margin:15px 0;font-weight:700;font-size:16px;}
.prices{display:flex;gap:10px;}
.price-btn{flex:1;background:#fff3e0;color:#333;border:none;padding:12px;border-radius:15px;font-family:'Cairo';font-weight:700;font-size:16px;cursor:pointer;}
.price-btn.active{background:#ff6a00;color:white;}

.btn-close{width:100%;background:#eee;color:#333;border:none;padding:14px;border-radius:15px;font-family:'Cairo';font-weight:700;font-size:16px;margin-bottom:20px;cursor:pointer;}
</style>
</head>
<body>

<div class="header">
  <i class="fa-solid fa-arrow-right" onclick="history.back()"></i>
  <div class="logo">سهلة <span>للتوصيل</span></div>
  <i class="fa-solid fa-bars"></i>
</div>

<div style="position:relative;">
  <div id="map"></div>
  <div class="map-badge badge-a"><i class="fa-solid fa-motorcycle"></i> 4 دقيقة<br>1,0 كم</div>
  <div class="map-badge badge-b"><i class="fa-solid fa-location-dot"></i> 15 دقيقة<br>11,6 كم</div>
</div>

<div class="card">
  <div class="tag"><i class="fa-solid fa-motorcycle"></i> طلب توصيل</div>
  <div class="price">
    <div class="km"><i class="fa-regular fa-clock"></i> 1,0 كم</div>
    <div class="amount">60 جنيه</div>
  </div>

  <div class="info">
    <div class="info-main">
      <h3>مطعم الشيف حسن <i class="fa-solid fa-utensils" style="color:#ff6a00;"></i></h3>
      <p>المنصورة الجديدة, CJG+RV<br>المنصورة الجديدة، محافظة الدقهلية<br>(الساموني)</p>
    </div>
    <div class="client">
      <img src="https://i.imgur.com/8Km9tLL.png">
      <div style="font-weight:700;">العميل</div>
      <div class="rate">4.93 <i class="fa-solid fa-star"></i></div>
      <div style="font-size:12px;color:#666;">(24)<br>الآن</div>
    </div>
  </div>

  <button class="btn-main" onclick="acceptOrder()">
    <i class="fa-solid fa-motorcycle"></i> القبول مقابل 60 جنيه
  </button>

  <div class="suggest">اقترح أجرك</div>
  <div class="prices">
    <button class="price-btn active" data-price="60">60 جنيه</button>
    <button class="price-btn" data-price="72">72 جنيه</button>
    <button class="price-btn" data-price="66">66 جنيه</button>
  </div>

  <button class="btn-close" onclick="history.back()">إغلاق</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var from = [31.0422,31.3787]; // شارع الجمهورية
var to = [31.0409,31.3756]; // حي الجامعة

// الخريطة
var map = L.map('map', {zoomControl: false}).setView([31.0415,31.3770], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
L.marker(from).addTo(map).bindPopup("A - البداية");
L.marker(to).addTo(map).bindPopup("B - العميل");
L.polyline([from, to], {color: '#ff6a00', weight: 4}).addTo(map);

// زرار القبول = يفتح الاتجاهات
function acceptOrder(){
  window.open(`https://www.google.com/maps/dir/${from[0]},${from[1]}/${to[0]},${to[1]}`, '_blank');
}

// تغيير السعر
document.querySelectorAll('.price-btn').forEach(btn=>{
  btn.onclick = function(){
    document.querySelectorAll('.price-btn').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    let price = this.getAttribute('data-price');
    document.querySelector('.amount').innerText = price + ' جنيه';
    document.querySelector('.btn-main').innerHTML = `<i class="fa-solid fa-motorcycle"></i> القبول مقابل ${price} جنيه`;
  }
})
</script>

</body>
  </html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>سهلة للتوصيل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#f2f2f2}

.header{background:#ff6600;color:white;padding:12px 16px;border-radius:0 0 30px 30px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:100}
.header.center{flex:1;text-align:center;font-size:26px;font-weight:800}
.header.center span{font-size:15px;font-weight:400;display:block;margin-top:-4px}
.header i{font-size:24px}

/* هنا حطينا صورة الخريطة */
.map{position:relative;height:45vh;background:url('map-bg.jpg') center/cover no-repeat;border-bottom:1px solid #ddd}
.badge{position:absolute;top:12px;padding:9px 12px;border-radius:14px;color:white;font-weight:800;font-size:14px;text-align:center;line-height:1.5}
.badge-green{left:12px;background:#00a651}
.badge-blue{right:12px;background:#007aff}

.card{background:white;margin:-25px 10px 15px 10px;border-radius:20px;padding:14px;position:relative;z-index:99}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.tag{background:#ff6600;color:white;padding:8px 12px;border-radius:20px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px}
.tag i{font-size:16px}
.price{text-align:left}
.price.km{font-size:13px;color:#666;display:flex;align-items:center;gap:4px;justify-content:flex-end}
.price.amount{font-size:28px;font-weight:800}

.info{display:flex;gap:12px;border-bottom:1px dashed #ddd;padding:12px 0;margin:12px 0}
.info-main{flex:1;text-align:right}
.info-main h3{font-size:17px;font-weight:800;display:flex;align-items:center;gap:6px;margin-bottom:6px;justify-content:flex-end}
.info-main h3 i{background:#ff6600;color:white;padding:4px;border-radius:50%;font-size:11px}
.info-main p{font-size:12px;color:#555;line-height:1.7}
.client{border-right:1px solid #eee;padding-right:12px;text-align:center;min-width:70px}
.avatar{width:55px;height:55px;border-radius:50%;background:#e0e0e0;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto}
.client-name{font-weight:800;font-size:13px;margin-top:4px}
.client-rate{font-weight:800;font-size:13px}
.client-rate i{color:#ffc107;font-size:12px}

.step{display:none}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-family:'Cairo';font-size:16px;font-weight:800;display:flex;justify-content:center;align-items:center;gap:8px;margin:8px 0;color:white}
.btn-orange{background:#ff6600}
.btn-green{background:#00a651;justify-content:space-between;padding:14px 16px}
.btn-green.check{width:30px;height:30px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center}
.btn-green.check i{color:#00a651}
.btn-blue{background:#007aff;justify-content:space-between;padding:14px 16px}
.btn-blue.box{width:30px;height:30px;background:white;border-radius:7px;display:flex;align-items:center;justify-content:center}
.btn-blue.box i{color:#007aff}
.suggest{text-align:center;color:#666;font-weight:700;margin:6px 0;font-size:14px}
</style>
</head>
<body>

<div class="header">
  <i class="fa-solid fa-arrow-right"></i>
  <div class="center">سهلة <i class="fa-solid fa-motorcycle"></i><span>للتوصيل</span></div>
  <i class="fa-solid fa-bars"></i>
</div>

<div class="map">
  <div class="badge badge-green">15 دقيقة<br>11,6 كم</div>
  <div class="badge badge-blue">4 دقيقة<br>1,0 كم</div>
</div>

<div class="card">
  <div class="top">
    <div class="tag"><i class="fa-solid fa-motorcycle"></i> طلب توصيل</div>
    <div class="price">
      <div class="km"><i class="fa-regular fa-clock" style="color:#ff6600"></i> 1,0 كم</div>
      <div class="amount"><span id="orderPrice">40</span> جنيه</div>
    </div>
  </div>

  <div class="info">
    <div class="info-main">
      <h3>مطعم الشيف حسن <i class="fa-solid fa-utensils"></i></h3>
      <p>,CJG+RV). المنصورة الجديدة<br>المنصورة الجديدة، محافظة الدقهلية<br>(الساموني)</p>
    </div>
    <div class="client">
      <div class="avatar">😊</div>
      <div class="client-name">العميل</div>
      <div class="client-rate">4.93 <i class="fa-solid fa-star"></i></div>
      <small style="font-size:11px;color:#777">(24)<br>الآن</small>
    </div>
  </div>

  <div class="step" id="step1" style="display:block">
    <button class="btn btn-orange" onclick="goStep(2)"><i class="fa-solid fa-motorcycle"></i> القبول مقابل <span id="btnPrice">40</span> جنيه</button>
    <div class="suggest">اقترح أجرك</div>
  </div>
  <div class="step" id="step2">
    <button class="btn btn-green" onclick="goStep(3)"><i class="fa-solid fa-motorcycle"></i> استلمت الطلب <div class="check"><i class="fa-solid fa-check"></i></div></button>
  </div>
  <div class="step" id="step3">
    <button class="btn btn-orange" onclick="goStep(4)"><i class="fa-solid fa-location-arrow"></i> الاتجاه الى العميل</button>
  </div>
  <div class="step" id="step4">
    <button class="btn btn-blue" onclick="finish()"><i class="fa-solid fa-box"></i> تم تسليم الطلب <div class="box"><i class="fa-solid fa-check"></i></div></button>
  </div>
</div>

<script>
var orderAmount = 40; // غير السعر من هنا
var commissionRate = 0.15; // 15%

document.getElementById('btnPrice').innerText = orderAmount;
document.getElementById('orderPrice').innerText = orderAmount;

function goStep(n){
  for(let i=1;i<=4;i++){ document.getElementById('step'+i).style.display='none'; }
  document.getElementById('step'+n).style.display='block';
}

function finish(){
  function gC(n){let d=document.cookie.split(';');for(let i=0;i<d.length;i++){let c=d[i];while(c.charAt(0)==' ')c=c.substring(1);if(c.indexOf(n+'=')==0)return c.substring(n.length+1,c.length)}return 50}
  function sC(n,v){document.cookie=n+"="+v+";path=/;max-age=31536000"}
  var balance=parseFloat(gC("balance"));
  var commission = orderAmount * commissionRate;
  balance = balance - commission; if(balance<0) balance=0; sC("balance",balance);
  alert("تم تسليم الطلب ✓\nالعمولة 15%: "+commission.toFixed(2)+" جنيه\nرصيدك: "+balance.toFixed(2)+" جنيه");
  location.href='home.html';
}
</script>
</body>
  </html>

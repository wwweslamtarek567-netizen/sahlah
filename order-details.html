<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سهلة للتوصيل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#f2f2f2}
.header{background:#ff6a00;color:white;padding:14px 18px;border-radius:0 0 25px 25px;display:flex;justify-content:space-between;align-items:center}
.header.title{text-align:center;font-size:24px;font-weight:800}
.header.title span{font-size:14px;font-weight:400;display:block}
.header i{font-size:24px}

.map-wrap{position:relative;height:45vh;background:#a8d5ff;overflow:hidden}
.badge{position:absolute;top:12px;padding:10px 14px;border-radius:16px;color:white;font-weight:800;font-size:15px;text-align:center;line-height:1.5;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
.badge-green{left:12px;background:#00a651}
.badge-blue{right:12px;background:#007aff}
.badge::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border-left:8px solid transparent;border-right:8px solid transparent}
.badge-green::after{border-top:8px solid #00a651}
.badge-blue::after{border-top:8px solid #007aff}
.route{position:absolute;bottom:38%;left:8%;right:10%;height:6px;background:#00a651;border-radius:10px}
.route-tag{position:absolute;bottom:36%;left:50%;background:white;padding:3px 8px;border-radius:6px;border:2px solid #333;font-weight:800;font-size:12px}
.point-b{position:absolute;bottom:35%;left:8%;width:44px;height:44px;background:#00a651;border-radius:50%;color:white;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;border:3px solid white}
.point-a{position:absolute;bottom:35%;right:10%;width:52px;height:52px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;border:5px solid #ff6a00}
.point-a i{color:#1a1a1a;font-size:26px}
.zoom{position:absolute;left:15px;bottom:15px;display:flex;flex-direction:column;gap:10px}
.zoom button{width:50px;height:50px;border-radius:50%;border:none;background:white;font-size:28px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
.loc{position:absolute;right:15px;bottom:15px;width:50px;height:50px;border-radius:50%;border:none;background:white;font-size:22px;box-shadow:0 2px 8px rgba(0,0,0,0.2)}

.card{background:white;margin:-25px 12px 20px 12px;border-radius:22px;padding:16px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.tag{background:#ff6a00;color:white;padding:10px 16px;border-radius:25px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}
.tag i{font-size:18px}
.price{text-align:left}
.price.km{font-size:14px;color:#666;display:flex;align-items:center;gap:5px;justify-content:flex-end}
.price.amount{font-size:32px;font-weight:800;color:#1a1a1a}

.info{display:flex;gap:15px;border-bottom:1px dashed #ddd;padding:15px 0;margin:15px 0}
.info-main{flex:1}
.info-main h3{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.info-main h3 i{background:#ff6a00;color:white;padding:6px;border-radius:50%;font-size:14px}
.info-main p{font-size:13px;color:#444;line-height:1.6}
.client{border-right:1px solid #eee;padding-right:15px;text-align:center;min-width:80px}
.client.avatar{width:65px;height:65px;border-radius:50%;background:#e0e0e0;display:flex;align-items:center;justify-content:center;font-size:32px}
.client.name{font-weight:800;font-size:15px;margin-top:5px}
.client.rate{font-weight:800;font-size:15px}
.client.rate i{color:#ffb400;font-size:14px}
.client small{font-size:12px;color:#777}

.step{display:none}
.btn{width:100%;padding:16px;border:none;border-radius:16px;font-family:'Cairo';font-size:17px;font-weight:800;display:flex;justify-content:center;align-items:center;gap:10px;margin:10px 0;color:white}
.btn i{font-size:22px}
.btn-orange{background:#ff6a00}
.btn-green{background:#00a651;justify-content:space-between;padding:16px 18px}
.btn-green.check{width:32px;height:32px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center}
.btn-green.check i{color:#00a651;font-size:18px}
.btn-blue{background:#007aff;justify-content:space-between;padding:16px 18px}
.btn-blue.box{width:32px;height:32px;background:white;border-radius:8px;display:flex;align-items:center;justify-content:center}
.btn-blue.box i{color:#007aff;font-size:18px}
.suggest{text-align:center;color:#666;font-weight:700;margin:8px 0;font-size:15px}
</style>
</head>
<body>

<div class="header">
  <i class="fa-solid fa-arrow-left"></i>
  <div class="title">سهلة <i class="fa-solid fa-motorcycle"></i><span>للتوصيل</span></div>
  <i class="fa-solid fa-bars"></i>
</div>

<div class="map-wrap">
  <div class="badge badge-green">15 دقيقة<br>11,6 كم</div>
  <div class="badge badge-blue">4 دقيقة<br>1,0 كم</div>
  <div class="route"></div>
  <div class="route-tag">40</div>
  <div class="point-b">B</div>
  <div class="point-a"><i class="fa-solid fa-motorcycle"></i></div>
  <div class="zoom"><button>+</button><button>-</button></div>
  <button class="loc"><i class="fa-solid fa-location-crosshairs"></i></button>
</div>

<div class="card">
  <div class="top">
    <div class="tag"><i class="fa-solid fa-motorcycle"></i> طلب توصيل</div>
    <div class="price">
      <div class="km"><i class="fa-regular fa-clock"></i> 1,0 كم</div>
      <div class="amount"><span id="orderAmount">40</span> جنيه</div>
    </div>
  </div>

  <div class="info">
    <div class="info-main">
      <h3>مطعم الشيف حسن <i class="fa-solid fa-utensils"></i></h3>
      <p>,CJG+RV). المنصورة الجديدة<br>المنصورة الجديدة، محافظة الدقهلية<br>(الساموني)</p>
    </div>
    <div class="client">
      <div class="avatar">😊</div>
      <div class="name">العميل</div>
      <div class="rate">4.93 <i class="fa-solid fa-star"></i></div>
      <small>(24)<br>الآن</small>
    </div>
  </div>

  <div class="step" id="step1" style="display:block">
    <button class="btn btn-orange" onclick="goStep(2)"><i class="fa-solid fa-motorcycle"></i> القبول مقابل <span id="priceBtn">40</span> جنيه</button>
    <div class="suggest">اقترح أجرك</div>
  </div>

  <div class="step" id="step2">
    <button class="btn btn-green" onclick="goStep(3)">استلمت الطلب <span class="check"><i class="fa-solid fa-check"></i></span></button>
  </div>

  <div class="step" id="step3">
    <button class="btn btn-orange" onclick="goStep(4)"><i class="fa-solid fa-location-arrow"></i> الاتجاه الى العميل</button>
  </div>

  <div class="step" id="step4">
    <button class="btn btn-blue" onclick="finish()"><i class="fa-solid fa-box"></i> تم تسليم الطلب <span class="box"><i class="fa-solid fa-check"></i></span></button>
  </div>

</div>

<script>
var orderAmount = 40; // غير الرقم ده
var commissionRate = 0.15;

document.getElementById('priceBtn').innerText = orderAmount;
document.getElementById('orderAmount').innerText = orderAmount;

function goStep(n){
  for(let i=1;i<=4;i++){ document.getElementById('step'+i).style.display='none'; }
  document.getElementById('step'+n).style.display='block';
  if(n==2){ window.open("https://www.google.com/maps/dir/?api=1&destination=31.0422,31.3787","_system"); }
  if(n==4){ window.open("https://www.google.com/maps/dir/?api=1&destination=31.0409,31.3756","_system"); }
}

function finish(){
  function gC(n){let d=document.cookie.split(';');for(let i=0;i<d.length;i++){let c=d[i];while(c.charAt(0)==' ')c=c.substring(1);if(c.indexOf(n+'=')==0)return c.substring(n.length+1,c.length)}return 50}
  function sC(n,v){document.cookie=n+"="+v+";path=/;max-age=31536000"}
  var balance=parseFloat(gC("balance"));
  var commission = orderAmount * commissionRate;
  balance = balance - commission; if(balance<0) balance=0; sC("balance",balance);
  alert("تم تسليم الطلب ✓\nالعمولة 15%: "+commission.toFixed(2)+" جنيه\nرصيدك: "+balance.toFixed(2)+" جنيه");
  location.href='home.html';
}
</script>
</body>
  </html>

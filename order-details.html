<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
body{margin:0;font-family:'Cairo',sans-serif;background:#f7f7f7}
.header{background:#ff6a00;color:white;padding:15px;text-align:center;font-size:20px;font-weight:800}
#map{height:35vh;width:100%}iframe{border:0;width:100%;height:100%}
.card{background:white;margin:-20px 15px 15px 15px;padding:15px;border-radius:15px}
.btn{width:100%;padding:15px;border:none;border-radius:12px;font-size:17px;font-weight:800;margin:8px 0;color:white;display:flex;justify-content:space-between;align-items:center}
.b1{background:#ff6a00}.b2{background:#28a745}.b3{background:#ff6a00}.b4{background:#007bff}
.step{display:none} /* نخفي كل الخطوات الاول */
</style></head><body>
<div class="header">سهلة للتوصيل</div>
<div id="map"><iframe src="https://www.google.com/maps/embed?pb=!1m28!1m12!1m3!1d54639!2d31.3756!3d31.0415!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!4m13!3e0!4m5!1s0x0!2zMzHCsDAyJzMyLjAiTiAzMcKwMjInNDMuMyJF!3m4!1s0x0!2zMzHCsDAyJzI3LjIiTiAzMcKwMjInMzIuMiJF!5e0!3m2!1sar!2seg!4v1"></iframe></div>

<div class="card">
  <h3>مطعم الشيف حسن</h3>
  <h2>40 جنيه</h2>

  <!-- الخطوة 1 -->
  <div class="step" id="step1" style="display:block">
    <button class="btn b1" onclick="goStep(2)">القبول مقابل 40 جنيه <i class="fa-solid fa-motorcycle"></i></button>
  </div>

  <!-- الخطوة 2 -->
  <div class="step" id="step2">
    <button class="btn b2" onclick="goStep(3)">استلمت الطلب <i class="fa-solid fa-circle-check"></i></button>
  </div>

  <!-- الخطوة 3 -->
  <div class="step" id="step3">
    <button class="btn b3" onclick="goStep(4)">الاتجاه الى العميل <i class="fa-solid fa-location-arrow"></i></button>
  </div>

  <!-- الخطوة 4 -->
  <div class="step" id="step4">
    <button class="btn b4" onclick="finish()">تم تسليم الطلب <i class="fa-solid fa-box"></i></button>
  </div>

</div>

<script>
// دالة واحدة بتخفي الكل وتظهر اللي بعده
function goStep(n){
  // اخفي الكل
  document.getElementById('step1').style.display='none';
  document.getElementById('step2').style.display='none';
  document.getElementById('step3').style.display='none';
  document.getElementById('step4').style.display='none';

  // اظهر اللي بعده
  document.getElementById('step'+n).style.display='block';

  // فتح الخريطة
  if(n==2){ window.open("https://www.google.com/maps/dir/?api=1&destination=31.0422,31.3787","_system"); }
  if(n==4){ window.open("https://www.google.com/maps/dir/?api=1&destination=31.0409,31.3756","_system"); }
}

// دالة الخصم
function finish(){
  function gC(n){let d=document.cookie.split(';');for(let i=0;i<d.length;i++){let c=d[i];while(c.charAt(0)==' ')c=c.substring(1);if(c.indexOf(n+'=')==0)return c.substring(n.length+1,c.length)}return 50}
  function sC(n,v){document.cookie=n+"="+v+";path=/;max-age=31536000"}
  var balance=parseFloat(gC("balance"));
  let d=6; balance=balance-d; sC("balance",balance);
  alert("تم خصم 6 جنيه\nرصيدك: "+balance.toFixed(2)+" جنيه");
  location.href='home.html';
}
</script></body></html>

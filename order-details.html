<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>سهلة للتوصيل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#f0f0f0}

.header{background:#ff6600;color:white;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
.header.center{flex:1;text-align:center;font-size:15px;font-weight:700}
.header.center i{font-size:18px;margin:0 4px}
.header i{font-size:20px;color:white}

.map{position:relative;height:32vh;background:url('map-bg.png') center/cover no-repeat}

.card{background:white;margin:-12px 6px 10px 6px;border-radius:14px;padding:10px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tag{background:#ff6600;color:white;padding:6px 9px;border-radius:14px;font-weight:700;font-size:11px;display:flex;align-items:center;gap:4px}
.price{text-align:left}
.price.km{font-size:11px;color:#666;display:flex;align-items:center;gap:3px;justify-content:flex-end}
.price.km i{color:#ff6600;font-size:11px}
.price.amount{font-size:19px;font-weight:800}

.info{display:flex;gap:8px;border-bottom:1px dashed #ddd;padding:8px 0}
.info-main{flex:1;text-align:right}
.info-main h3{font-size:14px;font-weight:800;display:flex;align-items:center;gap:4px;margin-bottom:4px;justify-content:flex-end}
.info-main h3 i{color:#ff6600;font-size:12px}
.info-main p{font-size:10px;color:#555;line-height:1.5}
.client{border-right:1px solid #eee;padding-right:8px;text-align:center;min-width:50px}
.avatar{width:38px;height:38px;border-radius:50%;background:#ffe066;display:flex;align-items:center;justify-content:center;font-size:18px;margin:0 auto}
.client-name{font-weight:800;font-size:10px;margin-top:2px}
.client-rate{font-weight:700;font-size:10px;display:flex;align-items:center;justify-content:center;gap:2px}
.client-rate i{color:#ffc107;font-size:9px}
.client small{font-size:8px;color:#777;display:block;line-height:1.2}

.step{display:none}
.btn{width:100%;padding:10px;border:none;border-radius:9px;font-family:'Cairo';font-size:13px;font-weight:800;display:flex;justify-content:center;align-items:center;gap:5px;margin:6px 0;color:white;cursor:pointer}
.btn i{font-size:14px}
.btn-orange{background:#ff6600} /* القبول */
.btn-red{background:#dc3545} /* استلمت */
.btn-blue{background:#007aff} /* الاتجاه */
.btn-green{background:#00a651} /* تم التسليم */

.suggest{text-align:center;color:#666;font-weight:600;margin:4px 0;font-size:11px}
</style>
</head>
<body>

<div class="header">
  <i class="fa-solid fa-arrow-left"></i>
  <div class="center">سهلة <i class="fa-solid fa-motorcycle"></i> للتوصيل</div>
  <i class="fa-solid fa-bars"></i>
</div>

<div class="map"></div>

<div class="card">
  <div class="top">
    <div class="price">
      <div class="km"><i class="fa-regular fa-clock"></i> 1,0 كم</div>
      <div class="amount"><span id="orderPrice">40</span> جنيه</div>
    </div>
    <div class="tag"><i class="fa-solid fa-motorcycle"></i> طلب توصيل</div>
  </div>

  <div class="info">
    <div class="client">
      <div class="avatar">😊</div>
      <div class="client-name">العميل</div>
      <div class="client-rate"><i class="fa-solid fa-star"></i> 4.93</div>
      <small>(24)</small>
      <small>الان</small>
    </div>
    <div class="info-main">
      <h3><i class="fa-solid fa-utensils"></i> مطعم الشيف حسن</h3>
      <p>(CJG+RV), المنصورة الجديدة<br>المنصورة الجديدة، محافظة الدقهلية<br>(الساموني)</p>
    </div>
  </div>

  <div class="step" id="step1" style="display:block">
    <button class="btn btn-orange" onclick="openGoogleMaps('A')"><i class="fa-solid fa-motorcycle"></i> القبول مقابل <span id="btnPrice">40</span> جنيه</button>
    <div class="suggest">اقترح أجرك</div>
  </div>
  <div class="step" id="step2">
    <button class="btn btn-red" onclick="pickedOrder()"><i class="fa-solid fa-motorcycle"></i> استلمت الطلب</button>
  </div>
  <div class="step" id="step3">
    <button class="btn btn-blue" onclick="openGoogleMaps('B')"><i class="fa-solid fa-location-arrow"></i> الاتجاه الى العميل</button>
  </div>
  <div class="step" id="step4">
    <button class="btn btn-green" onclick="finishOrder()"><i class="fa-solid fa-box"></i> تم تسليم الطلب</button>
  </div>
</div>

<script>
var orderAmount = 40; // سعر الطلب
var commissionRate = 0.15; // 15%

// حط هنا احداثيات المطعم والعميل الحقيقية
var locationA = "31.0414,31.3785"; // احداثيات المطعم A
var locationB = "31.0500,31.3900"; // احداثيات العميل B

document.getElementById('btnPrice').innerText = orderAmount;
document.getElementById('orderPrice').innerText = orderAmount;

function goStep(n){
  for(let i=1;i<=4;i++){ document.getElementById('step'+i).style.display='none'; }
  document.getElementById('step'+n).style.display='block';
}

function getCookie(n){
  let d=document.cookie.split(';');
  for(let i=0;i<d.length;i++){
    let c=d[i];
    while(c.charAt(0)==' ')c=c.substring(1);
    if(c.indexOf(n+'=')==0)return c.substring(n.length+1,c.length)
  }
  return 50
}

function setCookie(n,v){
  document.cookie=n+"="+v+";path=/;max-age=31536000"
}

// 1. القبول اورنج = يفتح جوجل ماب للمطعم A
function openGoogleMaps(point){
  if(point == 'A'){
    var url = "https://www.google.com/maps/dir/?api=1&destination=" + locationA + "&travelmode=driving";
  } else {
    var url = "https://www.google.com/maps/dir/?api=1&destination=" + locationB + "&travelmode=driving";
  }
  window.open(url, '_blank');

  if(point == 'A') goStep(2);
  if(point == 'B') goStep(4);
}

// 2. استلمت احمر = يغير الزرار بس
function pickedOrder(){
  goStep(3);
}

// 4. تم التسليم اخضر = خصم 15%
function finishOrder(){
  var balance = parseFloat(getCookie("balance"));
  var commission = orderAmount * commissionRate;
  balance = balance - commission;
  if(balance < 0) balance = 0;
  setCookie("balance", balance.toFixed(2));

  alert("تم تسليم الطلب ✓\n\nسعر الطلب: " + orderAmount + " جنيه\nالعمولة 15%: " + commission.toFixed(2) + " جنيه\nرصيدك الحالي: " + balance.toFixed(2) + " جنيه");
  location.href='home.html';
}
</script>
</body>
  </html>

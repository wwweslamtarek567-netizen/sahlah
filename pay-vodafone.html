<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فودافون كاش</title>
<script src="admin/config.js"></script>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f5f5f5;font-family:'Cairo',Tajawal,sans-serif}
.header{background:#e30613;color:#fff;padding:20px;text-align:center;font-size:20px;font-weight:bold}
.box{background:#fff;margin:20px;border-radius:18px;padding:20px;box-shadow:0 4px 15px #0001;text-align:center}
.box img{width:80px;height:80px;border-radius:18px;margin-bottom:10px}
.num{font-size:28px;font-weight:bold;letter-spacing:2px;margin:15px 0;background:#f9f9f9;padding:12px;border-radius:12px;border:2px dashed #e30613;direction:ltr}
.btn{background:#e30613;color:#fff;border:none;padding:14px 0;width:100%;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn2{background:#000;color:#fff;border:none;padding:14px 0;width:100%;border-radius:12px;font-size:16px;margin-top:12px;cursor:pointer}
.btn2:disabled{background:#888}
.steps{text-align:right;margin-top:20px;background:#fff9f9;padding:15px;border-radius:12px;font-size:14px;line-height:1.8}
input{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:1px solid #ddd;box-sizing:border-box;font-family:'Cairo'}
#preview{width:100%;border-radius:12px;margin-top:12px;display:none;max-height:300px;object-fit:contain;border:1px solid #eee}
</style>
<script>
function copyNum(){navigator.clipboard.writeText("01025025973");alert("تم نسخ الرقم: 01025025973");}
let base64Img = "";

function onFile(e){
  let file = e.target.files[0];
  if(!file) return;
  if(file.size > 2*1024*1024) return alert("الصورة كبيرة، اختار صورة اقل من 2 ميجا");
  let reader = new FileReader();
  reader.onload = function(ev){
    base64Img = ev.target.result;
    let img = document.getElementById('preview');
    img.src = base64Img;
    img.style.display='block';
  }
  reader.readAsDataURL(file);
}

function getRiderPhone(){
  let p = new URLSearchParams(location.search).get('phone');
  if(p) return p;
  return localStorage.getItem('rider_phone') || localStorage.getItem('phone') || "غير معروف";
}

async function submitRecharge(){
  let amount = document.getElementById('amount').value.trim();
  let phone = getRiderPhone();

  if(!amount) return alert("اكتب المبلغ");
  if(!base64Img) return alert("ارفع صورة التحويل");

  let btn = document.getElementById('sendBtn');
  btn.disabled = true;
  btn.innerText = "جاري الارسال...";

  // حاول تجيب اسم المندوب
  let riderName = phone;
  try{
    let r = await fetch(DB_URL + '/riders.json');
    let data = await r.json();
    if(data){
      let list = Array.isArray(data)? data : Object.values(data);
      let found = list.find(x => String(x.phone||x.id).trim() == String(phone).trim());
      if(found) riderName = found.name || phone;
    }
  }catch(e){}

  let payload = {
    phone: phone,
    riderName: riderName,
    amount: amount,
    screenshot: base64Img,
    status: "pending",
    timestamp: new Date().toISOString(),
    dateStr: new Date().toLocaleString('ar-EG')
  };

  try{
    let res = await fetch(DB_URL + '/recharge_requests.json', {
      method: "POST",
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error();
    alert("✅ تم استلام طلبك يا غالي، هيتم تفعيل الرصيد خلال دقايق وهتلاقيه في حسابك");
    location.href = 'index.html';
  }catch(e){
    alert("فشل الارسال، اتأكد من النت وحاول تاني");
    btn.disabled = false;
    btn.innerText = "✅ انا حولت - تأكيد";
  }
}
</script>
</head>
<body>
<div class="header">فودافون كاش - Vodafone Cash</div>

<div class="box">
<img src="vodafone.webp" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Vodafone_icon.svg/1200px-Vodafone_icon.svg.png'">
<h2>حول على الرقم ده</h2>
<div class="num">01025025973</div>
<button class="btn" onclick="copyNum()">📋 نسخ الرقم</button>

<div class="steps">
<b>خطوات التحويل:</b><br>
1- افتح انا فودافون واختار فودافون كاش<br>
2- دوس تحويل اموال واكتب الرقم اللي فوق<br>
3- اكتب المبلغ اللي عايز تشحنه<br>
4- بعد التحويل ارفع سكرين شوت التحويل تحت
</div>

<input type="text" id="amount" placeholder="اكتب المبلغ اللي حولته مثلا 500" inputmode="numeric">
<input type="file" accept="image/*" onchange="onFile(event)">
<img id="preview">

<button id="sendBtn" class="btn2" onclick="submitRecharge()">✅ انا حولت - تأكيد</button>
<br><br>
<button onclick="location.href='payment.html'" style="background:none;border:none;color:#888;cursor:pointer">‹ رجوع لطرق الدفع</button>
</div>
</body>
  </html>

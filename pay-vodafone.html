<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>فودافون كاش</title>
<style>body{margin:0;background:#f5f5f5;font-family:Cairo,sans-serif}.h{background:#e30613;color:#fff;padding:18px;text-align:center;font-weight:800}.box{background:#fff;margin:15px;border-radius:18px;padding:18px;text-align:center}.num{font-size:26px;font-weight:800;border:2px dashed #e30613;padding:12px;border-radius:12px;direction:ltr;background:#fff5f5}input{width:100%;padding:14px;margin-top:12px;border-radius:12px;border:1.5px solid #ddd}button{width:100%;padding:14px;border:none;border-radius:12px;font-weight:800;margin-top:12px;cursor:pointer}#prev{width:100%;display:none;border-radius:12px;margin-top:10px;border:1px solid #eee}</style>
<script>const DB_URL="https://sahlah-c6152-default-rtdb.firebaseio.com";</script>
</head>
<body>
<div class="h">فودافون كاش 01025025973</div>
<div class="box">
<div class="num">01025025973</div>
<button style="background:#e30613;color:#fff" onclick="navigator.clipboard.writeText('01025025973');alert('تم النسخ')">📋 نسخ الرقم</button>
<input id="phone" placeholder="رقمك المسجل في سهلة 010...">
<input id="amount" type="number" placeholder="المبلغ">
<input id="file" type="file" accept="image/*">
<div id="st" style="font-size:12px;color:#888;margin-top:6px"></div>
<img id="prev">
<button id="send" style="background:#000;color:#fff" disabled>اختار صورة التحويل</button>
</div>
<script>
let b64="", ready=false;
let saved=localStorage.getItem('rider_phone')||""; if(saved) document.getElementById('phone').value=saved;

document.getElementById('file').onchange=e=>{
 let f=e.target.files[0]; if(!f) return;
 document.getElementById('st').innerText="جاري الضغط..."; document.getElementById('send').disabled=true;
 let r=new FileReader();
 r.onload=ev=>{
  let im=new Image();
  im.onload=()=>{
   let c=document.createElement('canvas'), max=700, w=im.width, h=im.height;
   if(w>max){h=h*max/w; w=max;} c.width=w; c.height=h; c.getContext('2d').drawImage(im,0,0,w,h);
   b64=c.toDataURL('image/jpeg',0.4);
   document.getElementById('prev').src=b64; document.getElementById('prev').style.display='block';
   document.getElementById('st').innerText="✅ الصورة جاهزة - "+Math.round(b64.length/1024)+"KB";
   document.getElementById('send').disabled=false; document.getElementById('send').innerText="✅ تأكيد التحويل"; ready=true;
  };
  im.src=ev.target.result;
 };
 r.readAsDataURL(f);
};

document.getElementById('send').onclick=async()=>{
 let phone=document.getElementById('phone').value.trim();
 let amount=document.getElementById('amount').value.trim();
 if(phone.length<10) return alert('اكتب رقمك');
 if(!amount) return alert('اكتب المبلغ');
 if(!ready) return alert('استنى الصورة تجهز');

 document.getElementById('send').innerText="جاري البحث عن اسمك...";
 // هات اسم المندوب من قاعدة البيانات
 let riderName=phone;
 try{
  let rs=await fetch(DB_URL+'/riders.json'); let riders=await rs.json();
  if(riders){
   if(Array.isArray(riders)){
    let f=riders.find(x=>String(x.phone||"")==String(phone));
    if(f) riderName=f.name||f.riderName||phone;
   }else{
    for(let k in riders){ if(String(riders[k].phone||k)==String(phone)){ riderName=riders[k].name||riders[k].riderName||phone; break; } }
   }
  }
 }catch(e){}

 localStorage.setItem('rider_phone',phone);
 document.getElementById('send').innerText="جاري الارسال...";

 let payload={phone:phone, riderName:riderName, name:riderName, amount:parseFloat(amount), screenshot:b64, status:"pending", timestamp:Date.now(), dateStr:new Date().toLocaleString('ar-EG')};

 let res=await fetch(DB_URL+'/recharge_requests.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
 let j=await res.json();
 alert('تم ارسال الطلب ✅ باسم: '+riderName);
 location.href='index.html';
};
</script>
</body>
  </html>

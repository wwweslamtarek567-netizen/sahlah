<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فودافون كاش - سهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;font-family:'Cairo',sans-serif}
.header{background:#e30613;color:#fff;padding:20px;text-align:center;font-size:20px;font-weight:800}
.box{background:#fff;margin:16px;border-radius:18px;padding:20px;box-shadow:0 4px 15px #0001;text-align:center}
.logo{width:70px;height:70px;border-radius:16px}
.num{font-size:26px;font-weight:800;letter-spacing:1px;margin:14px 0;background:#fff5f5;padding:14px;border-radius:12px;border:2px dashed #e30613;direction:ltr}
.btn{background:#e30613;color:#fff;border:none;padding:14px 0;width:100%;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer}
.btn2{background:#000;color:#fff;border:none;padding:14px 0;width:100%;border-radius:12px;font-size:16px;font-weight:800;margin-top:12px;cursor:pointer}
.btn2:disabled{background:#888;cursor:not-allowed}
.steps{text-align:right;margin-top:18px;background:#fff9f9;padding:14px;border-radius:12px;font-size:13px;line-height:1.9;border:1px solid #ffe0e0}
input{width:100%;padding:14px;margin-top:12px;border-radius:12px;border:1.5px solid #ddd;font-family:'Cairo';font-size:14px}
#preview{width:100%;border-radius:12px;margin-top:12px;display:none;max-height:350px;object-fit:contain;border:1px solid #eee}
#status{font-size:12px;margin-top:8px;min-height:18px}
</style>
<script>
// رابط الفايربيز بتاعك - متغيرش
const DB_URL = "https://sahlah-c6152-default-rtdb.firebaseio.com";
</script>
</head>
<body>
<div class="header">فودافون كاش - Vodafone Cash</div>

<div class="box">
<img class="logo" src="vodafone.webp" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Vodafone_icon.svg/512px-Vodafone_icon.svg.png'">
<h2 style="margin:10px 0 5px">حول على الرقم ده</h2>
<div class="num">01025025973</div>
<button class="btn" onclick="navigator.clipboard.writeText('01025025973');alert('تم نسخ الرقم: 01025025973')">📋 نسخ الرقم</button>

<div class="steps">
<b>خطوات التحويل:</b><br>
1- افتح انا فودافون واختار فودافون كاش<br>
2- دوس تحويل اموال واكتب الرقم اللي فوق<br>
3- اكتب المبلغ اللي عايز تشحنه<br>
4- بعد التحويل ارفع سكرين شوت التحويل تحت
</div>

<input type="tel" id="phone" placeholder="رقمك اللي مسجل بيه في سهلة (010...)">
<input type="number" id="amount" placeholder="المبلغ اللي حولته مثلا 500">
<input type="file" id="file" accept="image/*">
<div id="status"></div>
<img id="preview">

<button id="sendBtn" class="btn2" disabled>⏳ اختار صورة التحويل أولا</button>
<br><br>
<button onclick="location.href='payment.html'" style="background:none;border:none;color:#888;font-family:'Cairo'">‹ رجوع لطرق الدفع</button>
</div>

<script>
let base64Img = "";
let isReady = false;
const fileInput = document.getElementById('file');
const preview = document.getElementById('preview');
const statusEl = document.getElementById('status');
const sendBtn = document.getElementById('sendBtn');
const phoneInput = document.getElementById('phone');
const amountInput = document.getElementById('amount');

// املا الرقم لو متسجل قبل كده
let saved = localStorage.getItem('rider_phone') || localStorage.getItem('phone') || new URLSearchParams(location.search).get('phone') || "";
if(saved) phoneInput.value = saved;

fileInput.addEventListener('change', (e)=>{
  let file = e.target.files[0];
  if(!file){ return; }
  if(file.size > 10*1024*1024){ alert('الصورة كبيرة جدا، اختار صورة اقل من 10 ميجا'); return; }

  statusEl.style.color = '#e67e00';
  statusEl.innerText = "⏳ جاري ضغط الصورة... استنى";
  sendBtn.disabled = true;
  sendBtn.innerText = "⏳ جاري تجهيز الصورة...";
  isReady = false;

  let reader = new FileReader();
  reader.onload = (ev)=>{
    let img = new Image();
    img.onload = ()=>{
      let canvas = document.createElement('canvas');
      let maxW = 700;
      let w = img.width, h = img.height;
      if(w > maxW){ h = h * maxW / w; w = maxW; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      base64Img = canvas.toDataURL('image/jpeg', 0.4); // ضغط 40%
      preview.src = base64Img;
      preview.style.display = 'block';
      statusEl.style.color = '#00a651';
      statusEl.innerText = "✅ الصورة جاهزة - حجمها " + Math.round(base64Img.length/1024) + " كيلو - دلوقتي تقدر تدوس تأكيد";
      sendBtn.disabled = false;
      sendBtn.innerText = "✅ انا حولت - تأكيد";
      isReady = true;
    };
    img.onerror = ()=>{ statusEl.innerText="❌ الصورة مش صالحة"; };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

sendBtn.addEventListener('click', async ()=>{
  let phone = phoneInput.value.trim();
  let amount = amountInput.value.trim();

  if(phone.length < 10) return alert("اكتب رقمك اللي مسجل بيه في سهلة");
  if(!amount || parseFloat(amount) <=0) return alert("اكتب المبلغ");
  if(!isReady ||!base64Img) return alert("استنى لما الصورة تجهز ويكتب ✅ الصورة جاهزة");

  localStorage.setItem('rider_phone', phone);
  sendBtn.disabled = true;
  sendBtn.innerText = "جاري الارسال...";

  let payload = {
    phone: phone,
    riderName: phone,
    amount: parseFloat(amount),
    screenshot: base64Img,
    status: "pending",
    timestamp: Date.now(),
    dateStr: new Date().toLocaleString('ar-EG')
  };

  try{
    let res = await fetch(DB_URL + '/recharge_requests.json', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    let data = await res.json();
    if(!data ||!data.name) throw new Error("فشل");
    alert("✅ تم استلام طلبك - كود الطلب: " + data.name + "\nهيتم تفعيل الرصيد خلال دقايق");
    location.href = 'index.html';
  }catch(err){
    alert("فشل الارسال، اتأكد من النت وحاول تاني");
    sendBtn.disabled = false;
    sendBtn.innerText = "✅ انا حولت - تأكيد";
  }
});
</script>
</body>
  </html>

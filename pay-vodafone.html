<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فودافون كاش</title>
<script src="config.js"></script>
<script src="admin/config.js"></script>
<style>body{margin:0;background:#f5f5f5;font-family:Cairo,sans-serif}.header{background:#e30613;color:#fff;padding:20px;text-align:center;font-weight:bold}.box{background:#fff;margin:20px;border-radius:18px;padding:20px;text-align:center}.num{font-size:26px;font-weight:bold;background:#f9f9f9;padding:12px;border-radius:12px;border:2px dashed #e30613;direction:ltr}.btn{background:#e30613;color:#fff;border:none;padding:14px;width:100%;border-radius:12px;font-weight:bold;cursor:pointer;margin-top:10px}.btn2{background:#000;color:#fff;border:none;padding:14px;width:100%;border-radius:12px;margin-top:12px;cursor:pointer}input{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:1px solid #ddd}#preview{width:100%;display:none;margin-top:10px;border-radius:12px}</style>
</head>
<body>
<div class="header">فودافون كاش</div>
<div class="box">
<h3>حول على الرقم ده</h3>
<div class="num">01025025973</div>
<button class="btn" onclick="navigator.clipboard.writeText('01025025973');alert('تم نسخ الرقم')">📋 نسخ الرقم</button>
<input type="text" id="amount" placeholder="المبلغ مثلا 500" inputmode="numeric">
<input type="text" id="phoneInput" placeholder="رقمك اللي بتدخل بيه التطبيق مثلا 010...">
<input type="file" id="fileIn" accept="image/*">
<img id="preview">
<button id="sendBtn" class="btn2" onclick="submitRecharge()">✅ انا حولت - تأكيد</button>
</div>
<script>
let base64Img="";
document.getElementById('fileIn').addEventListener('change', e=>{
 let file=e.target.files[0]; if(!file) return;
 let img=new Image();
 img.onload=()=>{
   let canvas=document.createElement('canvas');
   let max=800;
   let w=img.width, h=img.height;
   if(w>max){h=h*max/w; w=max;}
   canvas.width=w; canvas.height=h;
   canvas.getContext('2d').drawImage(img,0,0,w,h);
   base64Img=canvas.toDataURL('image/jpeg',0.5); // ضغط جامد
   document.getElementById('preview').src=base64Img;
   document.getElementById('preview').style.display='block';
 };
 img.src=URL.createObjectURL(file);
});

function getPhone(){
 let urlPhone=new URLSearchParams(location.search).get('phone');
 let saved=localStorage.getItem('rider_phone')||localStorage.getItem('phone')||localStorage.getItem('riderPhone');
 let typed=document.getElementById('phoneInput').value.trim();
 return typed || urlPhone || saved || "";
}

async function submitRecharge(){
 let amount=document.getElementById('amount').value.trim();
 let phone=getPhone();
 if(!phone) return alert("اكتب رقمك اللي مسجل بيه عشان الرصيد يوصلك");
 if(!amount) return alert("اكتب المبلغ");
 if(!base64Img) return alert("ارفع صورة التحويل");
 document.getElementById('sendBtn').innerText="جاري الارسال...";
 document.getElementById('sendBtn').disabled=true;

 // خزن الرقم عشان بعد كده
 localStorage.setItem('rider_phone',phone);

 let payload={phone:phone, amount:parseFloat(amount), screenshot:base64Img, status:"pending", timestamp:Date.now(), dateStr:new Date().toLocaleString('ar-EG')};

 try{
  let res=await fetch(DB_URL+'/recharge_requests.json',{method:'POST',body:JSON.stringify(payload)});
  if(!res.ok) throw 0;
  alert("تم ✅ طلبك وصل للادارة وهيتأكد خلال دقايق");
  location.href='index.html';
 }catch(err){
  alert("فشل، حجم الصورة لسه كبير او النت ضعيف. جرب تصور الشاشة كروب");
  document.getElementById('sendBtn').disabled=false;
  document.getElementById('sendBtn').innerText="✅ انا حولت";
 }
}
// لو الرقم متسجل قبل كده املاه تلقائي
document.getElementById('phoneInput').value=getPhone();
</script>
</body>
  </html>

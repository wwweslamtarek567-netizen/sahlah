<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الرئيسية</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#ff6a00;min-height:100vh}
.header{text-align:center;padding:20px;color:white}
.header h1{font-size:32px;margin-bottom:5px}
.header p{font-size:14px}
.card{background:white;border-radius:18px;padding:18px;margin:12px;margin-bottom:15px}
.profile{display:flex;align-items:center;justify-content:space-between}
.profile img{width:55px;height:55px;border-radius:50%;border:2px solid #ff6a00}
.status{color:#666;font-size:14px}
.status .dot{display:inline-block;width:8px;height:8px;background:green;border-radius:50%;margin-right:5px}
.balance{text-align:center}
.balance h3{color:#333;margin-bottom:8px}
.balance .num{font-size:42px;color:#ff6a00;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px}
.box{background:white;border-radius:18px;padding:20px;text-align:center;font-weight:bold;color:#333}
.box span{font-size:28px;display:block;margin-bottom:8px}
.gps-btn{background:transparent;border:2px solid white;color:white;border-radius:15px;padding:15px;text-align:center;margin:12px;font-weight:bold;font-size:16px}
.nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:12px 0;border-radius:25px 25px 0 0}
.nav div{text-align:center;font-size:12px;color:#999}
.nav div.active{color:#ff6a00}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="header">
  <h1>سهلة</h1>
  <p>التوصيل بقي أسهل</p>
</div>

<div class="card profile">
  <div>
    <h3>أنت الآن</h3>
    <p class="status"><span class="dot"></span> متاح للعمل</p>
  </div>
  <img src="https://i.imgur.com/8Km9tLL.png" alt="">
</div>

<div class="card balance">
  <h3>رصيدك الحالي</h3>
  <div class="num">250</div>
  <p>جنيه</p>
</div>

<div class="grid">
  <div class="box"><span>📋</span>طلباتي</div>
  <div class="box"><span>📦</span>الطلبات الجديدة</div>
  <div class="box"><span>⭐</span>الأداء والتقييم</div>
  <div class="box"><span>💰</span>محفظتي</div>
</div>

<div class="gps-btn" onclick="window.location='map.html'">📍 تحديث موقعي</div>

<div class="nav">
  <div class="active">🏠<br>الرئيسية</div>
  <div>🗺️<br>الخريطة</div>
  <div>📋<br>الطلبات</div>
  <div>👤<br>الحساب</div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل مندوب جديد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Cairo', sans-serif;
}

body{
  background-color: #ff6a00;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.top-bg{
  width: 100%;
  height: 45vh;
  background-image: url('bg.jpg.png');
  background-size: cover;
  background-position: top center;
  background-repeat: no-repeat;
}

.container{
  background: white;
  border-radius: 30px 30px 0 0;
  padding: 25px 20px;
  margin-top: -30px;
  box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
  flex: 1;
}

.title{
  text-align: center;
  color: #ff6a00;
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 20px;
}

.input{
  margin-bottom: 12px;
}

.input input{
  width: 100%;
  padding: 14px 15px;
  border: 2px solid #eee;
  border-radius: 12px;
  font-size: 15px;
  background: #f9f9f9;
  outline: none;
  text-align: right;
}

.input input:focus{
  border-color: #ff6a00;
  background: white;
}

.btn{
  width: 100%;
  padding: 16px;
  background: #ff6a00;
  color: white;
  border: none;
  border-radius: 14px;
  font-size: 18px;
  font-weight: 700;
  margin-top: 10px;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="top-bg"></div>

<div class="container">
  <h2 class="title">تسجيل مندوب جديد</h2>

  <div class="input">
    <input type="text" placeholder="الاسم الكامل">
  </div>
  <div class="input">
    <input type="number" placeholder="السن">
  </div>
  <div class="input">
    <input type="text" placeholder="العنوان">
  </div>

  <button class="btn">تسجيل</button>
</div>

</body>
      </html>

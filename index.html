<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل مندوب - سهلة</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{
  background:url('https://drive.google.com/uc?export=view&id=1hkQRpM9e93vHXdj4TuvlvfvGSAnNa8Bu') no-repeat center/cover;
  min-height:100vh;
  padding:20px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
}
.logo{text-align:center;color:white;margin-bottom:20px;text-shadow:0 2px 8px rgba(0,0,0,0.4)}
.logo h1{font-size:48px;font-weight:900;letter-spacing:2px}
.logo p{font-size:16px;font-weight:400}
.container{background:white;border-radius:25px 25px 0 0;padding:25px 20px;margin:-20px -20px 0 -20px}
.title{text-align:center;color:#ff6a00;font-size:22px;font-weight:700;margin-bottom:20px}
.input{position:relative;margin-bottom:12px}
.input input{width:100%;padding:14px 45px 14px 15px;border:2px solid #eee;border-radius:12px;font-size:15px;background:#f9f9f9;outline:none}
.input input:focus{border-color:#ff6a00}
.input .icon{position:absolute;right:15px;top:50%;transform:translateY(-50%);font-size:20px;color:#777}
.options{display:flex;justify-content:space-between;margin:15px 0}
.option{border:2px solid #eee;border-radius:12px;padding:12px 5px;text-align:center;width:32%;font-size:13px;font-weight:700;cursor:pointer;transition:0.2s}
.option:hover{border-color:#ff6a00;background:#fff5f0}
.option .icon{font-size:28px;display:block;margin-bottom:5px}
.btn{width:100%;padding:16px;background:#ff6a00;color:white;border:none;border-radius:14px;font-size:18px;font-weight:700;margin-top:10px;cursor:pointer}
.btn:active{transform:scale(0.98)}
.link{text-align:center;margin-top:12px;font-size:14px;color:#555}
.link a{color:#ff6a00;font-weight:700;text-decoration:none}
</style>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

<div class="logo">
  <h1>سهلة</h1>
  <p>التوصيل بقي أسهل</p>
</div>

<div class="container">
  <h2 class="title">تسجيل مندوب جديد</h2>

  <div class="input">
    <span class="icon">👤</span>
    <input type="text" placeholder="الاسم الكامل">
  </div>
  <div class="input">
    <span class="icon">📅</span>
    <input type="number" placeholder="السن">
  </div>
  <div class="input">
    <span class="icon">📍</span>
    <input type="text" placeholder="العنوان">
  </div>

  <p style="text-align:center;margin:15px 0;font-weight:700">معاك ايه ؟</p>
  <div class="options">
    <div class="option"><span class="icon">🏍️</span>موتوسيكل</div>
    <div class="option"><span class="icon">🚲</span>عجلة</div>
    <div class="option"><span class="icon">🚶</span>على رجلك</div>
  </div>

  <button class="btn" onclick="window.location='home.html'">تسجيل</button>

  <div class="link">
    لديك حساب ؟ <a href="home.html">تسجيل دخول</a>
  </div>
</div>
</body>
  </html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سهلة - تسجيل مندوب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Cairo', sans-serif;
}

body{
  background-image: url('bg.jpg.png');
  background-size: contain; /* الصورة كلها هتبان ومش هتتقص */
  background-position: top center; /* فوق في النص */
  background-repeat: no-repeat; /* متتكررش */
  background-color: #ff6a00; /* اللون البرتقاني يملى الفراغ */
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding-bottom: 0;
}

.logo{
  text-align: center;
  color: white;
  padding: 20px;
  margin-bottom: 20px;
}

.logo h1{
  font-size: 42px;
  font-weight: 900;
  text-shadow: 0 2px 10px rgba(0,0,0,0.3);
}

.logo p{
  font-size: 16px;
  font-weight: 400;
  text-shadow: 0 2px 10px rgba(0,0,0,0.3);
}

.container{
  background: white;
  border-radius: 30px 30px 0 0;
  padding: 25px 20px;
  box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
}

.title{
  text-align: center;
  color: #ff6a00;
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 20px;
}

.input{
  margin-bottom: 12px;
}

.input input{
  width: 100%;
  padding: 14px 15px;
  border: 2px solid #eee;
  border-radius: 12px;
  font-size: 15px;
  background: #f9f9f9;
  outline: none;
  text-align: right;
}

.input input:focus{
  border-color: #ff6a00;
  background: white;
}

.btn{
  width: 100%;
  padding: 16px;
  background: #ff6a00;
  color: white;
  border: none;
  border-radius: 14px;
  font-size: 18px;
  font-weight: 700;
  margin-top: 10px;
  cursor: pointer;
}

.btn:active{
  transform: scale(0.98);
}
</style>
</head>
<body>

<div class="logo">
  <h1>سهلة</h1>
  <p>التوصيل بقي أسهل</p>
</div>

<div class="container">
  <h2 class="title">تسجيل مندوب جديد</h2>

  <div class="input">
    <input type="text" placeholder="الاسم الكامل">
  </div>
  <div class="input">
    <input type="number" placeholder="السن">
  </div>
  <div class="input">
    <input type="text" placeholder="العنوان">
  </div>

  <button class="btn">تسجيل</button>
</div>

</body>
  </html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل مندوب - سهلة</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{
  background:#ff6a00; /* لون برتقاني بدل الصورة */
  min-height:100vh;
  padding:20px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
}
.logo{text-align:center;color:white;margin-bottom:20px;text-shadow:0 2px 8px rgba(0,0,0,0.6)}
.logo h1{font-size:48px;font-weight:900}
.container{background:rgba(255,255,255,0.95);border-radius:25px 25px 0 0;padding:25px 20px;margin:-20px -20px 0 -20px}
.title{text-align:center;color:#ff6a00;font-size:22px;font-weight:700;margin-bottom:20px}
.input input{width:100%;padding:14px;border:2px solid #eee;border-radius:12px;font-size:15px;margin-bottom:12px;text-align:right}
.btn{width:100%;padding:16px;background:#ff6a00;color:white;border:none;border-radius:14px;font-size:18px;font-weight:700}
</style>
</head>
<body>
<div class="logo"><h1>سهلة</h1><p>التوصيل بقي أسهل</p></div>
<div class="container">
  <h2 class="title">تسجيل مندوب جديد</h2>
  <input type="text" placeholder="الاسم الكامل">
  <input type="number" placeholder="السن">
  <button class="btn">تسجيل</button>
</div>
</body>
    </html>

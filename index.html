<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سهلة - تسجيل مندوب</title>
<style>
body{
  margin:0;
  background-image: url('bg.jpg.png');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  font-family: 'Cairo', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.box{
  width: 100%;
  background: white;
  border-radius: 30px 30px 0 0;
  padding: 30px 20px;
}
h2{color:#ff6a00; text-align:center; margin-bottom:20px}
input{width:100%; padding:12px; margin-bottom:10px; border:1px solid #ddd; border-radius:10px; text-align:right}
button{width:100%; padding:14px; background:#ff6a00; color:white; border:none; border-radius:10px; font-size:18px; font-weight:bold}
</style>
</head>
<body>
  <div class="box">
    <h2>تسجيل مندوب جديد</h2>
    <input placeholder="الاسم الكامل">
    <input placeholder="السن">
    <input placeholder="العنوان">
    <button>تسجيل</button>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طريقة الدفع</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background:#f7f7f7}
.header{background:#ff6a00;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.header a{color:#fff;text-decoration:none}
.card{background:#fff;margin:12px;border-radius:20px;padding:16px}
.pay-option{border:1.5px solid #eee;border-radius:16px;padding:16px;display:flex;align-items:center;gap:14px;margin-top:12px;cursor:pointer;transition:.2s}
.pay-option:active{transform:scale(.98)}
.pay-option i{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.opt-voda i{background:#e60000;color:#fff}
.opt-insta i{background:#222;color:#fff}
.pay-option.num{font-weight:900;font-size:16px;direction:ltr}
</style>
</head>
<body>
<div class="header">
  <a href="shop.html"><i class="fa-solid fa-arrow-right"></i></a>
  <h2>اختر طريقة الدفع</h2>
</div>

<div class="card">
  <b id="orderPrice" style="color:#ff6a00;font-size:18px"></b>
  <div id="orderInfo" style="font-size:12px;color:#666;margin-top:6px;font-weight:700"></div>
</div>

<div class="card">
  <div class="pay-option opt-voda" onclick="goPay('vodafone')">
    <i class="fa-solid fa-mobile-screen"></i>
    <div style="flex:1">
      <b>فودافون كاش</b><br>
      <span class="num">01040791442</span><br>
      <small style="color:#666">اضغط للدفع ورفع الاسكرين</small>
    </div>
    <i class="fa-solid fa-chevron-left" style="color:#999;width:auto;background:none"></i>
  </div>

  <div class="pay-option opt-insta" onclick="goPay('instapay')">
    <i class="fa-solid fa-bolt"></i>
    <div style="flex:1">
      <b>انستا باي</b><br>
      <span class="num">01023284996</span><br>
      <small style="color:#666">اضغط للدفع ورفع الاسكرين</small>
    </div>
    <i class="fa-solid fa-chevron-left" style="color:#999;width:auto;background:none"></i>
  </div>
</div>

<script>
let tempOrder=null;
window.onload=()=>{
  let d=localStorage.getItem('temp_kit_order');
  if(!d){ location.href='shop.html'; return; }
  tempOrder=JSON.parse(d);
  document.getElementById('orderPrice').innerText=tempOrder.price+' جنيه';
  document.getElementById('orderInfo').innerText=tempOrder.name+' - '+tempOrder.kit+' - مقاس '+tempOrder.size;
};
function goPay(method){
  localStorage.setItem('temp_pay_method', method);
  if(method=='vodafone'){
    location.href='pay-vodafone.html';
  }else{
    location.href='pay-instapay.html';
  }
}
</script>
</body>
    </html>
